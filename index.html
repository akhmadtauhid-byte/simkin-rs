<style>

<div id="root" class="loading">Memuat sistem…</div>

<script>
/* ============ KONFIGURASI DASAR (nilai default, dapat diubah admin di Kelola Aspek Penilaian) ============ */
const DEFAULT_SIKAP_ASPEK = [
  {key:'kehadiran', nama:'Kehadiran', desc:'Persentase kehadiran terhadap hari kerja efektif', type:'auto'},
  {key:'ketepatan_waktu', nama:'Ketepatan Waktu', desc:'Frekuensi keterlambatan datang / pulang cepat', type:'auto'},
  {key:'kepatuhan_izin', nama:'Kepatuhan Izin/Cuti', desc:'Izin & cuti sesuai prosedur, tanpa alpha', type:'auto'},
  {key:'kedisiplinan', nama:'Kedisiplinan', desc:'Bebas dari Surat Peringatan / pelanggaran tata tertib', type:'auto'},
];
const DEFAULT_KINERJA_ASPEK = [
  {key:'produktivitas', nama:'Produktivitas Kerja', desc:'Pencapaian target/beban kerja unit', type:'manual'},
  {key:'kualitas_hasil', nama:'Kualitas Hasil Kerja', desc:'Ketelitian dan mutu pekerjaan yang dihasilkan', type:'manual'},
  {key:'ketepatan_tugas', nama:'Ketepatan Waktu Tugas', desc:'Penyelesaian tugas sesuai target waktu', type:'manual'},
  {key:'inisiatif', nama:'Inisiatif & Tanggung Jawab', desc:'Proaktif menyelesaikan masalah kerja', type:'manual'},
  {key:'kerjasama', nama:'Kerjasama Tim', desc:'Kolaborasi dengan rekan kerja & unit lain', type:'manual'},
];
const DEFAULT_MUTU_ASPEK = [
  {key:'skp', nama:'Kepatuhan SKP', desc:'Sasaran Keselamatan Pasien', type:'manual'},
  {key:'ppi', nama:'Kepatuhan PPI', desc:'Pencegahan & Pengendalian Infeksi', type:'manual'},
  {key:'ikp', nama:'Ketepatan Pelaporan IKP', desc:'Insiden Keselamatan Pasien sesuai SPO & waktu', type:'manual'},
  {key:'komplain', nama:'Penanganan Komplain', desc:'Jumlah & penanganan keluhan pelanggan', type:'manual'},
  {key:'kepuasan', nama:'Kepuasan Pasien thd Unit', desc:'Hasil survei kepuasan pasien terkait unit/petugas', type:'manual'},
];
const SCORE_LABEL = {1:'Kurang',2:'Cukup',3:'Baik',4:'Sangat Baik'};
const DEFAULT_WEIGHT = {sikap:30, kinerja:40, mutu:30};
function equalSplit(list){ const p=Math.round(100/list.length); const o={}; list.forEach((a,i)=>o[a.key]= i===list.length-1 ? (100-p*(list.length-1)) : p); return o; }
const DEFAULT_SUBWEIGHT = { sikap: equalSplit(DEFAULT_SIKAP_ASPEK), kinerja: equalSplit(DEFAULT_KINERJA_ASPEK), mutu: equalSplit(DEFAULT_MUTU_ASPEK) };
// Ambang batas skor otomatis Sikap Kerja (bisa diubah admin di menu Pengaturan → Ambang Batas Sikap Kerja)
const DEFAULT_SIKAP_THRESHOLDS = {
  kehadiran:       {higherBetter:true,  unit:'%',    t4:98, t3:95, t2:90}, // % kehadiran — makin tinggi makin baik
  ketepatan_waktu: {higherBetter:false, unit:'kali', t4:0,  t3:2,  t2:5},  // jumlah terlambat — makin rendah makin baik
  kepatuhan_izin:  {higherBetter:false, unit:'hari', t4:0,  t3:1,  t2:2},  // jumlah alpha/tanpa keterangan — makin rendah makin baik
  kedisiplinan:    {higherBetter:false, unit:'SP',   t4:0,  t3:1,  t2:2},  // jumlah Surat Peringatan aktif — makin rendah makin baik
};
const DEFAULT_TIERS = [
  {grade:'A', min:90, persen:100},
  {grade:'B', min:80, persen:90},
  {grade:'C', min:70, persen:75},
  {grade:'D', min:60, persen:50},
  {grade:'E', min:0,  persen:25},
];
const STATUS_FLOW = ['DRAFT','DIAJUKAN','VALIDASI_HRD','FINAL'];
const STATUS_LABEL = {
  DRAFT:'Draft', DIAJUKAN:'Diajukan', VALIDASI_HRD:'Divalidasi HRD', REVISI_HRD:'Revisi (HRD)',
  VALIDASI_DIKLAT:'Divalidasi Diklat', REVISI_DIKLAT:'Revisi (Diklat)', FINAL:'Final'
};

/* ============ AI HELPER (Claude API) ============ */
async function callClaudeAI(systemPrompt, userContent){
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      system: systemPrompt,
      messages: [{ role: "user", content: userContent }],
    })
  });
  const data = await response.json();
  if(data.error) throw new Error(data.error.message || 'AI error');
  const text = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
  return text;
}
function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result.split(',')[1]);
    r.onerror = ()=>reject(new Error('Gagal membaca file'));
    r.readAsDataURL(file);
  });
}
function buildAIContent(text, pdfAttachment){
  // pdfAttachment: {base64, name} or null
  if(!pdfAttachment) return text;
  const blocks = [{type:'document', source:{type:'base64', media_type:'application/pdf', data: pdfAttachment.base64}}];
  if(text && text.trim()) blocks.push({type:'text', text: text.trim()});
  else blocks.push({type:'text', text:'Baca dokumen terlampir dan ekstrak datanya sesuai instruksi.'});
  return blocks;
}
function parseAIJson(text){
  let clean = text.trim().replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
  const start = clean.indexOf('['); const startObj = clean.indexOf('{');
  // try array first, else object
  try{ return JSON.parse(clean); }catch(e){}
  if(start>=0){ try{ return JSON.parse(clean.slice(start, clean.lastIndexOf(']')+1)); }catch(e){} }
  if(startObj>=0){ try{ return JSON.parse(clean.slice(startObj, clean.lastIndexOf('}')+1)); }catch(e){} }
  throw new Error('Gagal membaca hasil AI. Coba lagi atau periksa format teks yang ditempel.');
}

/* ============ STORAGE WRAPPER ============ */
// Prioritas mode penyimpanan:
// 1) 'gas'   — kalau GAS_WEBAPP_URL diisi: data disimpan di Google Sheets lewat Apps Script,
//              bisa diakses dari perangkat manapun (mode yang dipakai untuk lintas perangkat).
// 2) 'cloud' — kalau dibuka lewat link chat Claude, window.storage tersedia otomatis.
// 3) 'local' — fallback terakhir: localStorage di perangkat ini saja.
//
// CARA AKTIFKAN MODE LINTAS PERANGKAT:
// Deploy backend (lihat file Code.gs yang disertakan terpisah) sebagai Google Apps Script
// Web App, lalu tempel URL hasil deploy-nya (diakhiri /exec) di baris di bawah ini.
const GAS_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbyrjprz4ytu_mmby1pK5sqsP6Uypd6KoM9q9ZdpG253ZiplKezW9_mtXe8ABgRV6hvf/exec';

const LS_PREFIX = 'simkin_rs_';
const STORAGE_MODE = GAS_WEBAPP_URL ? 'gas'
  : ((typeof window !== 'undefined' && typeof window.storage !== 'undefined' && window.storage !== null) ? 'cloud' : 'local');

async function gasFetch(params, isPost, body){
  // PENTING: penangkal cache (parameter waktu unik + cache:'no-store') HANYA dipasang untuk permintaan GET.
  // Browser TIDAK PERNAH men-cache respons POST secara default, jadi tidak perlu ditangkal — dan menambahkannya ke POST
  // ternyata membuat Google Apps Script gagal memproses pengalihan otomatisnya, menyebabkan diblokir CORS. Ini pelajaran mahal.
  if(isPost){
    const url = GAS_WEBAPP_URL;
    const opts = { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body) };
    const res = await fetch(url, opts);
    return await res.json();
  }
  const cacheBuster = '_ts=' + Date.now() + Math.random().toString(36).slice(2);
  const url = GAS_WEBAPP_URL + '?' + new URLSearchParams(params).toString() + '&' + cacheBuster;
  const opts = { method:'GET', cache:'no-store' };
  const res = await fetch(url, opts);
  return await res.json();
}

/** Diagnostik manual: kirim & ambil data uji ke server, tampilkan setiap langkah apa adanya
 * (status HTTP, balasan mentah) supaya kegagalan bisa dilihat persis di layar tanpa perlu DevTools. */
async function testGasConnection(){
  const log = [];
  const testKey = 'diag-test-'+Date.now();
  const testVal = 'ok-'+Date.now();
  if(!GAS_WEBAPP_URL){ log.push('❌ GAS_WEBAPP_URL masih kosong di dalam file.'); return log; }
  try{
    log.push('1) Mengirim data uji ke server (POST)…');
    const setRes = await fetch(GAS_WEBAPP_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({action:'set', key:testKey, value:testVal})});
    log.push('   Status HTTP: '+setRes.status+' '+setRes.statusText);
    const setText = await setRes.text();
    log.push('   Balasan mentah: '+setText.slice(0,300));
    let setJson=null; try{ setJson = JSON.parse(setText); }catch(e){ log.push('   ⚠️ Balasan BUKAN JSON valid — kemungkinan server mengirim halaman HTML/login, bukan hasil kode Apps Script.'); }
    if(setJson && setJson.ok){ log.push('   ✓ Server mengonfirmasi data tersimpan.'); }
    else if(setJson && setJson.error){ log.push('   ⚠️ Server membalas pesan error: '+setJson.error); }

    log.push('2) Mengambil kembali data uji dari server (GET)…');
    const getRes = await fetch(GAS_WEBAPP_URL+'?action=get&key='+encodeURIComponent(testKey));
    log.push('   Status HTTP: '+getRes.status+' '+getRes.statusText);
    const getText = await getRes.text();
    log.push('   Balasan mentah: '+getText.slice(0,300));
    let getJson=null; try{ getJson = JSON.parse(getText); }catch(e){ log.push('   ⚠️ Balasan BUKAN JSON valid.'); }
    if(getJson && getJson.value===testVal){ log.push('   ✅ COCOK — data berhasil bolak-balik ke server. Koneksi berfungsi normal!'); }
    else if(getJson){ log.push('   ⚠️ TIDAK COCOK. Diharapkan "'+testVal+'", server mengembalikan: '+JSON.stringify(getJson.value)); }

    fetch(GAS_WEBAPP_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({action:'delete', key:testKey})}).catch(()=>{});
    log.push('3) Data uji dibersihkan dari server.');
  }catch(e){
    log.push('❌ ERROR JARINGAN saat menghubungi server: '+(e.message||e));
    log.push('   Ini biasanya berarti permintaan diblokir kebijakan browser (CORS), koneksi internet terputus, atau alamat GAS_WEBAPP_URL salah/sudah tidak aktif.');
  }
  return log;
}

const MAX_CELL_CHARS = 40000; // aman di bawah batas 50.000 karakter/sel Google Sheets, dengan margin

/** Panggilan mentah ke server (tanpa pemecahan) — dipakai internal oleh lapisan chunking di bawah. */
async function _gasGetRaw(key){
  for(let attempt=0; attempt<2; attempt++){
    try{
      const r = await gasFetch({action:'get', key});
      return r.value!==undefined && r.value!==null && r.value!=='' ? r.value : null;
    }catch(e){
      if(attempt===0) await new Promise(res=>setTimeout(res,400));
      else throw e;
    }
  }
}
async function _gasSetRaw(key, value){
  let lastErr = null;
  for(let attempt=0; attempt<2; attempt++){
    try{ await gasFetch(null, true, {action:'set', key, value}); return; }
    catch(e){ lastErr = e; if(attempt===0) await new Promise(res=>setTimeout(res,400)); }
  }
  throw new Error('Gagal menyimpan "'+key+'" ke server bersama: '+(lastErr&&lastErr.message||lastErr));
}
async function _gasDeleteRaw(key){
  let lastErr = null;
  for(let attempt=0; attempt<2; attempt++){
    try{ await gasFetch(null, true, {action:'delete', key}); return; }
    catch(e){ lastErr = e; if(attempt===0) await new Promise(res=>setTimeout(res,400)); }
  }
  throw new Error('Gagal menghapus "'+key+'" di server bersama: '+(lastErr&&lastErr.message||lastErr));
}

/** Simpan nilai apa pun ke server — otomatis dipecah jadi beberapa bagian kalau melebihi batas karakter per sel Google Sheets. */
async function _gasSetChunked(key, value){
  if(value.length <= MAX_CELL_CHARS){
    await _gasSetRaw(key, value);
    return;
  }
  const chunks = [];
  for(let i=0;i<value.length;i+=MAX_CELL_CHARS) chunks.push(value.slice(i, i+MAX_CELL_CHARS));
  for(let i=0;i<chunks.length;i++){
    await _gasSetRaw(key+'::chunk:'+i, chunks[i]); // simpan tiap bagian dulu, satu per satu
  }
  // manifest ditulis PALING TERAKHIR — kalau ada bagian yang gagal di tengah, manifest lama/tidak ada, jadi get() tidak akan membaca data setengah jadi
  await _gasSetRaw(key, JSON.stringify({__simkinChunked__:true, count:chunks.length}));
}
/** Ambil nilai dari server — otomatis menyatukan kembali kalau nilainya berupa data yang terpecah. */
async function _gasGetChunked(key){
  const raw = await _gasGetRaw(key);
  if(raw===null) return null;
  try{
    const parsed = JSON.parse(raw);
    if(parsed && parsed.__simkinChunked__===true){
      const parts = await Promise.all(Array.from({length:parsed.count}, (_,i)=>_gasGetRaw(key+'::chunk:'+i)));
      return parts.map(p=>p||'').join('');
    }
  }catch(e){ /* bukan manifest pemecahan, berarti data biasa — pakai apa adanya */ }
  return raw;
}
async function _gasDeleteChunked(key){
  const raw = await _gasGetRaw(key);
  if(raw!==null){
    try{
      const parsed = JSON.parse(raw);
      if(parsed && parsed.__simkinChunked__===true){
        for(let i=0;i<parsed.count;i++) await _gasDeleteRaw(key+'::chunk:'+i);
      }
    }catch(e){}
  }
  await _gasDeleteRaw(key);
}

const Storage = {
  async get(key, shared){
    if(STORAGE_MODE==='gas'){
      try{
        const value = await _gasGetChunked(key);
        return value!==null ? {key, value, shared} : null;
      }catch(e){ /* jatuhkan ke lokal di bawah kalau server benar-benar tidak terjangkau */ }
    } else if(STORAGE_MODE==='cloud'){
      try{ return await window.storage.get(key, shared); }catch(e){ /* jatuhkan ke lokal */ }
    }
    try{
      const raw = window.localStorage.getItem(LS_PREFIX+key);
      return raw!==null ? {key, value:raw, shared} : null;
    }catch(e){ return null; }
  },
  async set(key, value, shared){
    if(STORAGE_MODE==='gas'){
      // Data bersama (multi-perangkat) — kalau gagal simpan ke server, JANGAN diam-diam simpan ke lokal seolah berhasil; biarkan pemanggil tahu.
      await _gasSetChunked(key, value);
      return {key, value, shared};
    } else if(STORAGE_MODE==='cloud'){
      return await window.storage.set(key, value, shared); // biarkan error menjalar kalau gagal, jangan disembunyikan
    }
    window.localStorage.setItem(LS_PREFIX+key, value);
    return {key, value, shared};
  },
  async delete(key, shared){
    if(STORAGE_MODE==='gas'){
      await _gasDeleteChunked(key);
      return {key, deleted:true, shared};
    } else if(STORAGE_MODE==='cloud'){
      return await window.storage.delete(key, shared);
    }
    window.localStorage.removeItem(LS_PREFIX+key);
    return {key, deleted:true, shared};
  },
  async list(prefix, shared){
    if(STORAGE_MODE==='gas'){
      try{
        const r = await gasFetch({action:'list', prefix: prefix||''});
        const keys = (r.keys||[]).filter(k=>k.indexOf('::chunk:')===-1); // sembunyikan bagian-bagian pecahan dari daftar, itu detail internal
        return {keys, prefix, shared};
      }catch(e){}
    } else if(STORAGE_MODE==='cloud'){
      try{ return await window.storage.list(prefix, shared); }catch(e){}
    }
    try{
      const keys = [];
      for(let i=0;i<window.localStorage.length;i++){
        const k = window.localStorage.key(i);
        if(k && k.indexOf(LS_PREFIX)===0){
          const realKey = k.slice(LS_PREFIX.length);
          if(!prefix || realKey.indexOf(prefix)===0) keys.push(realKey);
        }
      }
      return {keys, prefix, shared};
    }catch(e){ return {keys:[]}; }
  }
};

/** Pembuat ID unik yang AMAN dari bentrokan, termasuk saat membuat ratusan ID sekaligus dalam satu proses
 * (mis. impor massal Excel). Sebelumnya pakai Date.now()+angka acak kecil — itu SANGAT rawan bentrok kalau
 * ratusan dibuat dalam waktu bersamaan (mirip "kembar ulang tahun"), dan itulah penyebab bug data pegawai tertukar. */
let _idFallbackCounter = 0;
function generateId(prefix){
  if(typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function'){
    return prefix+'_'+crypto.randomUUID();
  }
  _idFallbackCounter = (_idFallbackCounter + 1) % 1000000;
  return prefix+'_'+Date.now()+'_'+_idFallbackCounter+'_'+Math.random().toString(36).slice(2,10);
}

async function mapLimit(items, limit, fn){
  const results = new Array(items.length);
  let idx = 0;
  async function worker(){
    while(idx < items.length){
      const i = idx++;
      try{ results[i] = await fn(items[i], i); }catch(e){ results[i] = undefined; }
    }
  }
  const workers = Array.from({length: Math.max(1, Math.min(limit, items.length))}, worker);
  await Promise.all(workers);
  return results;
}

/** Antrean penyimpanan per-key: memastikan penyimpanan berjalan berurutan (bukan berebutan/bersamaan),
 * supaya perubahan yang lebih baru tidak pernah tertimpa oleh penyimpanan lama yang selesai belakangan. */
const _saveQueues = {};
function queuedSave(queueKey, saveFn){
  const prev = _saveQueues[queueKey] || Promise.resolve();
  // saveFn tetap dijalankan berikutnya walau penyimpanan SEBELUMNYA di antrean ini gagal (supaya antrean tidak macet permanen)...
  const thisSave = prev.then(saveFn, saveFn);
  // ...tapi antrean internal tetap "sehat" untuk penyimpanan berikutnya, terlepas dari hasil penyimpanan saat ini.
  _saveQueues[queueKey] = thisSave.catch(()=>{});
  return thisSave; // pemanggil (bgSave / kode lain) TETAP melihat apakah penyimpanan INI berhasil atau gagal — tidak lagi disembunyikan
}

/* ============ ABSEN MANDIRI: GPS + SIDIK JARI (WebAuthn) ============ */
function arrBufToB64(buf){
  let bin=''; const bytes = new Uint8Array(buf);
  for(let i=0;i<bytes.byteLength;i++) bin += String.fromCharCode(bytes[i]);
  return window.btoa(bin);
}
function b64ToArrBuf(b64){
  const bin = window.atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return bytes.buffer;
}
function webauthnSupported(){
  return typeof window!=='undefined' && !!window.PublicKeyCredential && !!navigator.credentials && window.isSecureContext;
}
async function registerFingerprint(pegawaiId, pegawaiNama){
  if(!webauthnSupported()) throw new Error('Perangkat/browser ini tidak mendukung verifikasi sidik jari (WebAuthn), atau halaman tidak dibuka lewat alamat https:// yang aman.');
  const challenge = crypto.getRandomValues(new Uint8Array(32));
  const userId = new TextEncoder().encode(pegawaiId);
  const cred = await navigator.credentials.create({
    publicKey: {
      challenge,
      rp: { name: 'SIMKIN-RS Absen Mandiri' },
      user: { id: userId, name: pegawaiId, displayName: pegawaiNama },
      pubKeyCredParams: [{type:'public-key', alg:-7}, {type:'public-key', alg:-257}],
      authenticatorSelection: { authenticatorAttachment:'platform', userVerification:'required', residentKey:'preferred' },
      timeout: 60000,
      attestation: 'none'
    }
  });
  const credId = arrBufToB64(cred.rawId);
  window.localStorage.setItem('simkin_fp_'+pegawaiId, credId);
  return credId;
}
function fingerprintRegistered(pegawaiId){
  try{ return !!window.localStorage.getItem('simkin_fp_'+pegawaiId); }catch(e){ return false; }
}
async function verifyFingerprint(pegawaiId){
  if(!webauthnSupported()) throw new Error('Perangkat/browser ini tidak mendukung verifikasi sidik jari (WebAuthn), atau halaman tidak dibuka lewat alamat https:// yang aman.');
  const credId = window.localStorage.getItem('simkin_fp_'+pegawaiId);
  if(!credId) throw new Error('Sidik jari belum didaftarkan di perangkat ini.');
  const challenge = crypto.getRandomValues(new Uint8Array(32));
  const assertion = await navigator.credentials.get({
    publicKey: {
      challenge,
      allowCredentials: [{ id: b64ToArrBuf(credId), type:'public-key' }],
      userVerification: 'required',
      timeout: 60000
    }
  });
  return !!assertion;
}
/* ---- PIN Absen: metode verifikasi kedua/cadangan, tersimpan lokal per perangkat ---- */
function pinRegistered(pegawaiId){
  try{ return !!window.localStorage.getItem('simkin_pin_'+pegawaiId); }catch(e){ return false; }
}
function setAbsenPin(pegawaiId, pin){
  window.localStorage.setItem('simkin_pin_'+pegawaiId, pin);
}
function removeAbsenPin(pegawaiId){
  window.localStorage.removeItem('simkin_pin_'+pegawaiId);
}
function verifyAbsenPin(pegawaiId, inputPin){
  const stored = window.localStorage.getItem('simkin_pin_'+pegawaiId);
  return stored !== null && stored === inputPin;
}
/** Verifikasi identitas gabungan: coba sidik jari dulu (kalau terdaftar), kalau gagal/tidak tersedia dan PIN
 * juga terdaftar, otomatis tawarkan PIN sebagai cadangan. */
async function verifyIdentityForAbsen(pegawaiId){
  const hasFp = fingerprintRegistered(pegawaiId);
  const hasPin = pinRegistered(pegawaiId);
  if(!hasFp && !hasPin) throw new Error('Verifikasi belum diatur di perangkat ini. Daftarkan sidik jari atau PIN Absen terlebih dahulu.');

  if(hasFp){
    try{
      const ok = await verifyFingerprint(pegawaiId);
      if(ok) return true;
    }catch(e){
      if(!hasPin) throw e; // tidak ada metode cadangan, gagal total
      // sidik jari gagal/tidak terdeteksi — lanjut coba PIN di bawah
    }
  }
  if(hasPin){
    const input = prompt('Sidik jari tidak terdeteksi. Masukkan PIN Absen Anda:');
    if(input===null) throw new Error('Absen dibatalkan.');
    if(!verifyAbsenPin(pegawaiId, input)) throw new Error('PIN salah.');
    return true;
  }
  throw new Error('Verifikasi gagal.');
}
function getCurrentLocation(){
  return new Promise((resolve,reject)=>{
    if(!navigator.geolocation){ reject(new Error('Perangkat ini tidak mendukung GPS/lokasi.')); return; }
    navigator.geolocation.getCurrentPosition(
      pos=>resolve({lat:pos.coords.latitude, lng:pos.coords.longitude, akurasi:pos.coords.accuracy}),
      err=>reject(new Error('Gagal mengambil lokasi: '+err.message+'. Pastikan izin lokasi diaktifkan.')),
      {enableHighAccuracy:true, timeout:15000, maximumAge:0}
    );
  });
}
/** Ambil lokasi dengan dua sampel berjarak singkat untuk mendeteksi indikasi lokasi palsu (bukan 100% pasti,
 * tapi GPS asli selalu sedikit bergeser antar-pembacaan — sedangkan banyak aplikasi fake GPS memberi
 * koordinat statis yang persis identik terus-menerus). Menambah sedikit waktu tunggu (~1 detik) demi ini. */
async function getLocationWithSpoofCheck(){
  const loc1 = await getCurrentLocation();
  await new Promise(res=>setTimeout(res, 900));
  const loc2 = await getCurrentLocation();
  const flags = [];
  if(loc1.lat===loc2.lat && loc1.lng===loc2.lng){
    flags.push('Koordinat tidak bergeser sama sekali antar-pembacaan (±1 detik) — GPS asli biasanya sedikit berubah.');
  }
  if(loc2.akurasi!=null && loc2.akurasi < 3){
    flags.push('Akurasi GPS tidak wajar tinggi ('+loc2.akurasi.toFixed(1)+' m).');
  }
  if(loc2.akurasi!=null && loc2.akurasi > 1000){
    flags.push('Akurasi GPS sangat buruk ('+Math.round(loc2.akurasi)+' m) — sinyal lemah atau tidak wajar.');
  }
  return { lat:loc2.lat, lng:loc2.lng, akurasi:loc2.akurasi, suspicious: flags.length>0, flags };
}
function distanceMeters(lat1,lng1,lat2,lng2){
  const R=6371000, toRad=d=>d*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLng=toRad(lng2-lng1);
  const a=Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

async function doAbsen(pegawaiId, jenis){ // jenis: 'masuk' | 'pulang'
  const dateISO = todayISO();
  const logPromise = getAbsensiLog(pegawaiId, dateISO); // mulai diambil dari sekarang, berbarengan dengan proses GPS & verifikasi di bawah (tidak saling bergantung)
  const loc = await getLocationWithSpoofCheck();
  if(state.geofence.lat!=null && state.geofence.lng!=null){
    const jarak = distanceMeters(loc.lat, loc.lng, state.geofence.lat, state.geofence.lng);
    if(jarak > state.geofence.radius){
      throw new Error('Anda berada di luar radius lokasi RS (jarak ±'+Math.round(jarak)+' m, batas '+state.geofence.radius+' m). Absen ditolak.');
    }
  }
  const verified = await verifyIdentityForAbsen(pegawaiId);
  if(!verified) throw new Error('Verifikasi identitas gagal.');
  const log = await logPromise; // pada titik ini biasanya sudah selesai duluan (GPS & verifikasi biasanya lebih lama)
  const now = new Date();

  log[jenis] = { jam, lat:loc.lat, lng:loc.lng, akurasi:loc.akurasi, suspicious:loc.suspicious, suspicionFlags:loc.flags };

/** Shift efektif pegawai pada TANGGAL tertentu: cek Jadwal Jaga dulu (kalau ada),
 * baru jatuh ke shift default pegawai, baru ke jam default umum. */
async function getShiftForDate(pegawaiId, dateISO){
  const p = state.pegawai.find(x=>x.id===pegawaiId);
  if(!p) return state.shiftConfig;
  const ym = dateISO.slice(0,7);
  const day = Number(dateISO.slice(8,10));
  const roster = await getJadwal(p.unitId, ym);
  const code = roster[pegawaiId] ? roster[pegawaiId][day] : null;
  if(code === 'libur') return {libur:true, nama:'Libur'};
  if(code){
    const def = state.shiftDefs.find(s=>s.key===code);
    if(def) return def;
  }
  return getShiftForPegawai(pegawaiId);
}

/** Pindai rentang tanggal untuk catatan absen yang ditandai mencurigakan (indikasi GPS palsu). */
async function scanSuspiciousLogs(pegawaiId, startISO, endISO){
  const start = new Date(startISO), end = new Date(endISO);
  const dates = [];
  for(let d=new Date(start); d<=end; d.setDate(d.getDate()+1)){
    const iso = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if(new Date(iso) > new Date(todayISO())) break;
    dates.push(iso);
  }
  const results = await mapLimit(dates, 10, async (iso)=>{
    const log = await getAbsensiLog(pegawaiId, iso);
    const flagged = [];
    ['masuk','pulang'].forEach(jenis=>{
      if(log[jenis] && log[jenis].suspicious){
        flagged.push({tanggal:iso, jenis, alasan: log[jenis].suspicionFlags||[]});
      }
    });
    return flagged;
  });
  return results.flat();
}

async function computeAttendanceSummary(pegawaiId, startISO, endISO){
  const start = new Date(startISO), end = new Date(endISO);
  let totalHari=0, hadirHari=0, terlambatHari=0, alphaHari=0, liburHari=0;
  const shiftNamaTerpakai = new Set();
  for(let d=new Date(start); d<=end; d.setDate(d.getDate()+1)){
    const iso = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if(new Date(iso) > new Date(todayISO())) break; // jangan hitung hari yang belum terjadi
    const shift = await getShiftForDate(pegawaiId, iso); // shift hari itu, sesuai Jadwal Jaga (bisa beda tiap hari)
    if(shift.libur){ liburHari++; continue; } // hari libur tidak dihitung sebagai hari kerja
    totalHari++;
    shiftNamaTerpakai.add(shift.nama||'Default');
    const log = await getAbsensiLog(pegawaiId, iso);
    if(log.masuk){
      hadirHari++;
      const [jamH, menitH] = shift.jamMulai.split(':').map(Number);
      const [jm, mm] = log.masuk.jam.split(':').map(Number);
      const menitMasuk = jm*60+mm, menitBatas = jamH*60+menitH+shift.toleransiMenit;
      if(menitMasuk > menitBatas) terlambatHari++;
    } else {
      alphaHari++;
    }
  }
  const hadir_persen = totalHari>0 ? Math.round((hadirHari/totalHari)*1000)/10 : 100;
  return { hadir_persen, terlambat:terlambatHari, alpha:alphaHari, totalHari, hadirHari, liburHari, shiftNama: [...shiftNamaTerpakai].join(', ')||'Default' };
}

function slugify(nama){
  return 'asp_'+nama.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,30)+'_'+Math.floor(Math.random()*10000);
}
function addAspek(compKey, nama, desc, type){
  const key = slugify(nama||'aspek');
  state.aspekConfig[compKey].push({key, nama:nama.trim(), desc:(desc||'').trim(), type: type||'manual'});
  // beri bobot default merata ulang agar totalnya tetap masuk akal
  const n = state.aspekConfig[compKey].length;
  const even = Math.floor(100/n);
  const w = {};
  state.aspekConfig[compKey].forEach((a,i)=> w[a.key] = i===n-1 ? (100-even*(n-1)) : even);
  state.subWeight[compKey] = w;
  return key;
}
function removeAspek(compKey, key){
  state.aspekConfig[compKey] = state.aspekConfig[compKey].filter(a=>a.key!==key);
  delete state.subWeight[compKey][key];
  // ratakan ulang bobot yang tersisa agar tetap total 100
  const remaining = state.aspekConfig[compKey];
  if(remaining.length>0){
    const n = remaining.length;
    const even = Math.floor(100/n);
    const w = {};
    remaining.forEach((a,i)=> w[a.key] = i===n-1 ? (100-even*(n-1)) : even);
    state.subWeight[compKey] = w;
  }
}

/* ============ SCORING LOGIC ============ */
function tierScore(value, t){
  if(t.higherBetter){
    if(value>=t.t4) return 4;
    if(value>=t.t3) return 3;
    if(value>=t.t2) return 2;
    return 1;
  } else {
    if(value<=t.t4) return 4;
    if(value<=t.t3) return 3;
    if(value<=t.t2) return 2;
    return 1;
  }
}
function computeSikapFromAbsensi(ab){
  const th = state.sikapThresholds;
  return {
    kehadiran: tierScore(ab.hadir_persen, th.kehadiran),
    ketepatan_waktu: tierScore(ab.terlambat, th.ketepatan_waktu),
    kepatuhan_izin: tierScore(ab.alpha, th.kepatuhan_izin),
    kedisiplinan: tierScore(ab.sp_aktif, th.kedisiplinan),
  };
}

function avgScore(scoreObj, aspekList, subW){
  const entries = aspekList.filter(a=>typeof scoreObj[a.key]==='number');
  if(entries.length===0) return null;
  let wsum=0, total=0;
  entries.forEach(a=>{
    const w = (subW && typeof subW[a.key]==='number') ? subW[a.key] : (100/aspekList.length);
    wsum += w; total += scoreObj[a.key]*w;
  });
  if(wsum===0) return null;
  return total/wsum;
}

function computeFinal(pn, unitId){
  const sikapAuto = computeSikapFromAbsensi(pn.absensi);
  const sikapCombined = {...sikapAuto, ...(pn.sikap_score||{})}; // gabung skor otomatis (absensi) + skor manual (aspek tambahan)
  const sikapAvg = avgScore(sikapCombined, state.aspekConfig.sikap, state.subWeight.sikap);
  const kinerjaAvg = avgScore(pn.kinerja_score, state.aspekConfig.kinerja, state.subWeight.kinerja);
  const mutuAvg = avgScore(pn.mutu_score, state.aspekConfig.mutu, state.subWeight.mutu);
  const w = weightForUnit(unitId);
  const totalW = (w.sikap+w.kinerja+w.mutu)||100;
  let weighted = 0, wsum=0;
  if(sikapAvg!==null){ weighted += (sikapAvg/4)*w.sikap; wsum+=w.sikap; }
  if(kinerjaAvg!==null){ weighted += (kinerjaAvg/4)*w.kinerja; wsum+=w.kinerja; }
  if(mutuAvg!==null){ weighted += (mutuAvg/4)*w.mutu; wsum+=w.mutu; }
  const percent = wsum>0 ? (weighted/totalW)*100 : 0;
  let tier = state.tiers.slice().sort((a,b)=>b.min-a.min).find(t=>percent>=t.min) || state.tiers[state.tiers.length-1];
  return {sikapAuto, sikapCombined, sikapAvg, kinerjaAvg, mutuAvg, percent, tier, weightUsed:w, complete: sikapAvg!==null && kinerjaAvg!==null && mutuAvg!==null};
}

/* ============ RENDER HELPERS ============ */
function el(tag, attrs, children){
  const e = document.createElement(tag);
  const BOOL_PROPS = {disabled:1, checked:1, selected:1, readOnly:1, required:1};
  if(attrs) for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.startsWith('on')) e.addEventListener(k.substring(2), attrs[k]);
    else if(BOOL_PROPS[k]) e[k] = !!attrs[k]; // atribut boolean HTML: harus lewat properti DOM, bukan setAttribute (setAttribute('disabled', false) tetap menonaktifkan elemen!)
    else e.setAttribute(k, attrs[k]);
  }
  (children||[]).forEach(c=>{ if(c) e.appendChild(typeof c==='string'?document.createTextNode(c):c); });
  return e;
}

    input:['Input Penilaian','Sikap Kerja (absensi), Kinerja Pelayanan & Mutu Pelayanan — Unit '+unitName(state.currentUnitId)],
    input_ai:['Input Bulanan (AI)','Tempel catatan/laporan bulanan unit, AI bantu susun skor awal — Unit '+unitName(state.currentUnitId)],
    jadwal:['Jadwal Jaga','Atur shift kerja tiap pegawai per hari (shift bergilir) — Unit '+unitName(state.currentUnitId)],
    pegawai_ai:['Input Massal Pegawai','Upload Excel untuk data besar (instan), atau tempel teks bebas dibantu AI'],
    aspek_master:['Aspek Penilaian','Sesuaikan daftar aspek penilaian dengan regulasi/akreditasi rumah sakit (KARS, dsb)'],
    absen:['Absen Mandiri','Verifikasi lokasi & sidik jari untuk absen masuk/pulang'],
    validasi_hrd:['Validasi HRD','Verifikasi data Sikap Kerja berbasis absensi'],
    validasi_diklat:['Validasi Diklat','Verifikasi Kinerja Pelayanan & Mutu Pelayanan'],
    rekap:['Rekap & Tukin','Hasil akhir penilaian & persentase tukin — seluruh unit'],
    pengaturan:['Pengaturan Bobot','Bobot komponen, sub-aspek, & bobot khusus per unit'],
  };
  const t = titles[state.tab]||['','']
  topbar.appendChild(el('div',null,[ el('h2',null,[t[0]]), el('div',{class:'sub'},[t[1]]) ]));

  const periodeBox = el('div',{class:'periode-box'},[el('label',null,['Periode'])]);
  const pSel = el('select',{onchange: async (e)=>{
    if(e.target.value==='__new__'){
      const np = prompt('Nama periode baru (contoh: September 2026):');
      if(np && !state.periodeList.includes(np)){
        state.periodeList.push(np); bgSave(savePeriodeList());
        state.periode = np;
        await loadPenilaianForPeriode(np);
      }
    } else {
      state.periode = e.target.value;
      await loadPenilaianForPeriode(state.periode);
    }
    rerender();
  }});
  state.periodeList.forEach(pr=>{ const o=el('option',{value:pr},[pr]); if(pr===state.periode) o.selected=true; pSel.appendChild(o); });
  pSel.appendChild(el('option',{value:'__new__'},['+ Tambah periode baru']));
  periodeBox.appendChild(pSel);
  topbar.appendChild(periodeBox);
  main.appendChild(topbar);

  const body = el('div',{id:'body'});
  main.appendChild(body);
  const modeNote = STORAGE_MODE==='gas'
    ? 'Tersambung ke server bersama (Google Sheets) — data dapat diakses lintas perangkat oleh Kepala Unit, HRD, Diklat, dan Admin.'
    : STORAGE_MODE==='cloud'
    ? 'Data tersimpan otomatis dan dapat diakses bersama oleh Kepala Unit, HRD, Diklat, dan Admin.'
    : '⚠️ Mode Lokal — file ini dibuka langsung di luar chat Claude tanpa server bersama, jadi data hanya tersimpan di perangkat & browser ini saja. Untuk akses lintas perangkat, aktifkan koneksi server (lihat GAS_WEBAPP_URL) atau buka lewat link chat Claude.';
  main.appendChild(el('div',{class:'footer-note',style: STORAGE_MODE!=='local' ? '' : 'color:var(--amber);font-weight:600;max-width:600px;margin-left:auto;margin-right:auto;'},[modeNote]));
  app.appendChild(main);

  root.appendChild(app);

  if(state.role==='unit' && state.currentUnitId && unitNeedsLogin(state.currentUnitId)){
    renderUnitLogin(body);
  } else if(state.role==='admin' && state.adminPin && !state.adminAuthed){
    renderAdminLogin(body);
  } else if(state.role==='admin' && state.tab==='pengaturan' && state.superAdminPin && !state.superAdminAuthed){
    renderSuperAdminLogin(body);
  } else if(state.role==='hrd' && state.hrdPin && !state.hrdAuthed){
    renderRoleLogin(body, {icon:'🩺', title:'Masuk sebagai Manajer HRD & Diklat', desc:'Menu ini memvalidasi Sikap Kerja (berdasar data absensi) serta Kinerja Pelayanan & Mutu Pelayanan seluruh pegawai. Masukkan PIN untuk melanjutkan.', pin: state.hrdPin, authKey:'hrdAuthed', errorKey:'hrdLoginError'});
  } else {
    await renderTab(body);
  }

  if(state.modal) renderModal();
}

async function renderTab(body){
  if(state.tab==='dashboard') return renderDashboard(body);
  if(state.tab==='pegawai') return renderPegawai(body);
  if(state.tab==='unit_master') return renderUnitMaster(body);
  if(state.tab==='input') return renderInput(body);
  if(state.tab==='input_ai') return renderInputAI(body);
  if(state.tab==='jadwal') return renderJadwalJaga(body);
  if(state.tab==='pegawai_ai') return renderPegawaiAI(body);
  if(state.tab==='aspek_master') return renderAspekMaster(body);
  if(state.tab==='absen') return renderAbsenMandiri(body);
  if(state.tab==='validasi_hrd') return renderValidasiHRD(body);
  if(state.tab==='validasi_diklat') return renderValidasiDiklat(body);
  if(state.tab==='rekap') return renderRekap(body);
  if(state.tab==='pengaturan') return renderPengaturan(body);
}

/* ============ ABSEN MANDIRI (GPS + Sidik Jari) ============ */
function buildFingerprintCard(me){
  const registered = fingerprintRegistered(me.id);
  const box = el('div',{style:'border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;'});
  const head = el('div',{style:'display:flex;justify-content:space-between;align-items:center;'});
  head.appendChild(el('div',null,[
    el('div',{style:'font-weight:700;font-family:Lexend;font-size:13px;'},['🔒 Sidik Jari (sensor HP)']),
    el('div',{style:'font-size:11px;color:var(--ink-soft);margin-top:2px;'},[registered ? 'Sudah terdaftar di perangkat ini.' : 'Pakai sensor sidik jari bawaan HP — paling praktis.'])
  ]));
  head.appendChild(el('span',{class:'chip', style: registered?'background:var(--green-soft);color:var(--green);':''},[registered?'Aktif':'Belum']));
  box.appendChild(head);
  box.appendChild(el('button',{class:'btn btn-outline btn-sm',style:'margin-top:10px;width:100%;', disabled: !webauthnSupported() || state.absensiBusy, onclick: async ()=>{
    state.absensiBusy = true; state.absensiMsg=null; rerender();
    try{
      await registerFingerprint(me.id, me.nama);
      state.absensiMsg = {ok:true, text:'✓ Sidik jari berhasil didaftarkan di perangkat ini.'};
    }catch(e){
      state.absensiMsg = {ok:false, text: e.message||'Gagal mendaftarkan sidik jari.'};
    }
    state.absensiBusy = false; rerender();
  }},[registered ? 'Daftar Ulang Sidik Jari' : 'Daftarkan Sidik Jari']));
  if(!webauthnSupported()) box.appendChild(el('div',{class:'small-note',style:'margin-top:6px;'},['Tidak tersedia di perangkat/browser ini saat ini — pakai PIN sebagai gantinya.']));
  return box;
}

function buildPinCard(me){
  const registered = pinRegistered(me.id);
  const box = el('div',{style:'border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;'});
  const head = el('div',{style:'display:flex;justify-content:space-between;align-items:center;'});
  head.appendChild(el('div',null,[
    el('div',{style:'font-weight:700;font-family:Lexend;font-size:13px;'},['🔢 PIN Absen']),
    el('div',{style:'font-size:11px;color:var(--ink-soft);margin-top:2px;'},[registered ? 'Sudah diatur di perangkat ini.' : 'Cadangan kalau sidik jari tidak terdeteksi.'])
  ]));
  head.appendChild(el('span',{class:'chip', style: registered?'background:var(--green-soft);color:var(--green);':''},[registered?'Aktif':'Belum']));
  box.appendChild(head);

  if(state.pinSetupOpen){
    const p1 = el('input',{type:'password',inputmode:'numeric',placeholder:'PIN baru (min. 4 digit)',style:'padding:8px 10px;border:1px solid var(--line);border-radius:7px;width:100%;margin-top:8px;'});
    const p2 = el('input',{type:'password',inputmode:'numeric',placeholder:'Ulangi PIN',style:'padding:8px 10px;border:1px solid var(--line);border-radius:7px;width:100%;margin-top:8px;'});
    box.appendChild(p1); box.appendChild(p2);
    const btnRow = el('div',{style:'display:flex;gap:8px;margin-top:8px;'});
    btnRow.appendChild(el('button',{class:'btn btn-primary btn-sm', onclick:()=>{
      if(p1.value.length<4){ alert('PIN minimal 4 digit.'); return; }
      if(p1.value!==p2.value){ alert('Konfirmasi PIN tidak cocok.'); return; }
      setAbsenPin(me.id, p1.value);
      state.pinSetupOpen = false;
      state.absensiMsg = {ok:true, text:'✓ PIN Absen berhasil diatur.'};
      rerender();
    }},['Simpan PIN']));
    btnRow.appendChild(el('button',{class:'btn btn-outline btn-sm', onclick:()=>{ state.pinSetupOpen=false; rerender(); }},['Batal']));
    box.appendChild(btnRow);
  } else {
    const btnRow = el('div',{style:'display:flex;gap:8px;margin-top:10px;'});
    btnRow.appendChild(el('button',{class:'btn btn-outline btn-sm',style:'flex:1;', onclick:()=>{ state.pinSetupOpen=true; rerender(); }},[registered?'Ubah PIN':'Atur PIN']));
    if(registered){
      btnRow.appendChild(el('button',{class:'btn btn-outline btn-sm', onclick:()=>{
        if(confirm('Hapus PIN Absen dari perangkat ini?')){ removeAbsenPin(me.id); rerender(); }
      }},['Hapus']));
    }
    box.appendChild(btnRow);
  }
  return box;
}

function renderAbsenMandiri(body){
  if(!webauthnSupported()){
    body.appendChild(el('div',{class:'warn-note'},['⚠️ Perangkat/browser ini belum mendukung verifikasi sidik jari (WebAuthn), atau halaman tidak dibuka lewat alamat https:// yang aman. Fitur Absen Mandiri memerlukan aplikasi ini dihosting di alamat web (https), bukan dibuka langsung dari file yang diunduh. Fitur lain di aplikasi tetap bisa dipakai seperti biasa.']));
  }

  if(!state.myPegawaiId){
    const panel = el('div',{class:'panel',style:'max-width:420px;margin:20px auto;'});
    panel.appendChild(el('h3',{style:'margin-bottom:6px;'},['👤 Pilih Identitas Anda']));
    panel.appendChild(el('div',{class:'small-note',style:'margin-bottom:12px;'},['Perangkat ini akan diingat sebagai milik Anda untuk absen selanjutnya. Cari nama Anda di bawah ini.']));
    const searchInp = el('input',{placeholder:'Ketik nama Anda…',style:'width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;'});
    panel.appendChild(searchInp);
    const results = el('div',{style:'margin-top:10px;'});
    panel.appendChild(results);
    const renderResults = (q)=>{
      results.innerHTML='';
      if(!q || q.trim().length<2) return;
      const matches = state.pegawai.filter(p=>p.nama.toLowerCase().includes(q.toLowerCase())).slice(0,8);
      if(matches.length===0){ results.appendChild(el('div',{class:'small-note'},['Nama tidak ditemukan. Pastikan sudah terdaftar oleh Admin.'])); return; }
      matches.forEach(p=>{
        const row = el('div',{style:'padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;', onclick:()=>{
          state.myPegawaiId = p.id;
          try{ window.localStorage.setItem('simkin_my_pegawai_id', p.id); }catch(e){}
          rerender();
        }},[
          el('div',null,[el('div',{style:'font-weight:700;'},[p.nama]), el('div',{style:'font-size:11px;color:var(--ink-soft);'},[unitName(p.unitId)+' · '+p.jabatan])]),
          el('span',{style:'color:var(--teal);font-weight:700;'},['Pilih →'])
        ]);
        results.appendChild(row);
      });
    };
    searchInp.addEventListener('input', e=>renderResults(e.target.value));
    body.appendChild(panel);
    return;
  }

  const me = state.pegawai.find(p=>p.id===state.myPegawaiId);
  if(!me){
    body.appendChild(el('div',{class:'panel'},[el('div',{class:'warn-note'},['Data pegawai untuk perangkat ini tidak ditemukan (mungkin dihapus Admin).']),
      el('button',{class:'btn btn-outline',style:'margin-top:10px;', onclick:()=>{ state.myPegawaiId=null; try{window.localStorage.removeItem('simkin_my_pegawai_id');}catch(e){} rerender(); }},['Pilih Ulang Identitas'])]));
    return;
  }

  const panel = el('div',{class:'panel',style:'max-width:460px;margin:10px auto;'});
  const head = el('div',{style:'display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;'});
  head.appendChild(el('div',null,[el('h3',{style:'margin-bottom:2px;'},[me.nama]), el('div',{style:'font-size:11.5px;color:var(--ink-soft);'},[unitName(me.unitId)+' · '+me.jabatan])]));
  head.appendChild(el('button',{class:'btn btn-outline btn-sm', onclick:()=>{ state.myPegawaiId=null; try{window.localStorage.removeItem('simkin_my_pegawai_id');}catch(e){} rerender(); }},['Ganti']));
  panel.appendChild(head);

  if(state.absensiMsg){
    panel.appendChild(el('div',{style:'padding:9px 12px;border-radius:8px;font-size:12.5px;font-weight:600;margin-bottom:12px;'+(state.absensiMsg.ok?'background:var(--green-soft);color:var(--green);':'background:var(--red-soft);color:var(--red);')},[state.absensiMsg.text]));
  }

  if(!fingerprintRegistered(me.id) && !pinRegistered(me.id)){
    panel.appendChild(el('div',{class:'warn-note',style:'margin-bottom:12px;'},['Belum ada metode verifikasi di perangkat ini. Pilih salah satu (atau keduanya) — sidik jari sebagai utama, PIN sebagai cadangan kalau sidik jarinya sewaktu-waktu tidak terdeteksi.']));
    panel.appendChild(buildFingerprintCard(me));
    panel.appendChild(buildPinCard(me));
    body.appendChild(panel);
    return;
  }

  // sudah punya minimal 1 metode — tampilkan panel kelola (bisa dibuka/tutup) + tombol absen
  const manageToggle = el('div',{style:'display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:11.5px;'},[
    el('span',{style:'color:var(--ink-soft);'},['Metode aktif: '+[fingerprintRegistered(me.id)?'Sidik Jari':null, pinRegistered(me.id)?'PIN':null].filter(Boolean).join(' + ')]),
    el('button',{class:'btn btn-outline btn-sm', onclick:()=>{ state.absenManageOpen = !state.absenManageOpen; rerender(); }},[state.absenManageOpen?'Tutup':'⚙️ Kelola'])
  ]);
  panel.appendChild(manageToggle);
  if(state.absenManageOpen){
    panel.appendChild(buildFingerprintCard(me));
    panel.appendChild(buildPinCard(me));
  }

  // sudah terdaftar — tampilkan status hari ini & tombol absen
  const todayBox = el('div',{style:'text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;margin-bottom:14px;'});
  todayBox.appendChild(el('div',{style:'font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.4px;'},['Hari ini, '+new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long'})]));
  todayBox.appendChild(el('div',{id:'st-shift',style:'font-size:11.5px;color:var(--gold);font-weight:700;margin-top:4px;'},['Memuat shift…']));
  const statusRow = el('div',{style:'display:flex;justify-content:center;gap:24px;margin-top:8px;'});
  const masukEl = el('div',null,[el('div',{style:'font-size:10.5px;color:var(--ink-soft);'},['Masuk']), el('div',{id:'st-masuk',style:'font-family:Lexend;font-weight:800;font-size:18px;color:var(--teal);'},['—'])]);
  const pulangEl = el('div',null,[el('div',{style:'font-size:10.5px;color:var(--ink-soft);'},['Pulang']), el('div',{id:'st-pulang',style:'font-family:Lexend;font-weight:800;font-size:18px;color:var(--teal);'},['—'])]);
  statusRow.appendChild(masukEl); statusRow.appendChild(pulangEl);
  todayBox.appendChild(statusRow);
  panel.appendChild(todayBox);

  const btnRow = el('div',{style:'display:flex;gap:10px;'});
  const doPunch = async (jenis)=>{
    state.absensiBusy = true; state.absensiMsg=null; rerender();
    try{
      await doAbsen(me.id, jenis);
      state.absensiMsg = {ok:true, text:'✓ Absen '+(jenis==='masuk'?'Masuk':'Pulang')+' berhasil dicatat pukul '+new Date().toTimeString().slice(0,5)+'.'};
    }catch(e){
      state.absensiMsg = {ok:false, text: e.message||'Absen gagal.'};
    }
    state.absensiBusy = false; rerender();
  };
  btnRow.appendChild(el('button',{class:'btn btn-primary',style:'flex:1;padding:14px;font-size:14px;', disabled: state.absensiBusy, onclick:()=>doPunch('masuk')},[state.absensiBusy?'Memproses…':'📍 Absen Masuk']));
  btnRow.appendChild(el('button',{class:'btn btn-gold',style:'flex:1;padding:14px;font-size:14px;', disabled: state.absensiBusy, onclick:()=>doPunch('pulang')},[state.absensiBusy?'Memproses…':'📍 Absen Pulang']));
  panel.appendChild(btnRow);
  panel.appendChild(el('div',{class:'small-note',style:'margin-top:10px;'},['Menekan tombol akan meminta izin lokasi & verifikasi sidik jari perangkat. Absen ditolak otomatis kalau berada di luar radius lokasi RS yang ditetapkan Admin.']));

  body.appendChild(panel);

  // muat status hari ini secara async setelah elemen ter-render — dua panggilan ini dikirim BERSAMAAN, bukan menunggu satu selesai dulu
  (async ()=>{
    const [log, shift] = await Promise.all([
      getAbsensiLog(me.id, todayISO()),
      getShiftForDate(me.id, todayISO()),
    ]);
    const mEl = document.getElementById('st-masuk'); const pEl = document.getElementById('st-pulang');
    if(mEl) mEl.textContent = log.masuk ? log.masuk.jam : '—';
    if(pEl) pEl.textContent = log.pulang ? log.pulang.jam : '—';
    const sEl = document.getElementById('st-shift');
    if(sEl) sEl.textContent = shift.libur ? '🛌 Hari ini libur' : '🕐 Shift: '+shift.nama+' ('+shift.jamMulai+(shift.jamSelesai?'–'+shift.jamSelesai:'')+')';
  })();
}

/* ============ IMPOR EXCEL (tanpa AI — instan untuk data terstruktur) ============ */
function parseExcelPegawai(arrayBuffer){
  const wb = XLSX.read(arrayBuffer, {type:'array'});
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, {header:1, defval:''});
  let headerIdx = -1;
  for(let i=0;i<Math.min(rows.length,10);i++){
    if(rows[i].some(c=>String(c).trim().toLowerCase()==='nama')){ headerIdx = i; break; }
  }
  if(headerIdx===-1) headerIdx = 0;
  const header = rows[headerIdx].map(h=>String(h).trim().toLowerCase());
  const idxNama = header.findIndex(h=>h.includes('nama'));
  const idxUnit = header.findIndex(h=>h.includes('unit'));
  const idxJabatan = header.findIndex(h=>h.includes('jabatan'));
  const idxTukin = header.findIndex(h=>h.includes('tukin'));
  const idxShift = header.findIndex(h=>h.includes('shift'));
  const result = [];
  for(let i=headerIdx+1;i<rows.length;i++){
    const row = rows[i];
    const nama = idxNama>=0 ? String(row[idxNama]||'').trim() : '';
    if(!nama) continue;
    const shiftText = idxShift>=0 ? String(row[idxShift]||'').trim() : '';
    const shiftMatch = shiftText ? state.shiftDefs.find(s=>s.nama.toLowerCase()===shiftText.toLowerCase()) : null;
    result.push({
      nama,
      unit: idxUnit>=0 ? String(row[idxUnit]||'').trim() : '',
      jabatan: idxJabatan>=0 ? String(row[idxJabatan]||'').trim() : '',
      tukin: idxTukin>=0 ? (Number(row[idxTukin])||0) : 0,
      shiftKey: shiftMatch ? shiftMatch.key : '',
    });
  }
  return result;
}

        let unit = state.units.find(u=>u.nama.toLowerCase()===row.unit.trim().toLowerCase()) || newUnits.find(u=>u.nama.toLowerCase()===row.unit.trim().toLowerCase());
        if(!unit && row.unit.trim()){
          unit = {id:generateId('unit'), nama:row.unit.trim(), password:''};
          newUnits.push(unit);
        }
        newPegawai.push({id:generateId('peg'), nama:row.nama.trim(), unitId: unit?unit.id:null, jabatan:row.jabatan.trim()||'-', tukin_maks:row.tukin||0, shiftKey:row.shiftKey||''});
      }
      state.units.push(...newUnits);
      state.pegawai.push(...newPegawai);
      try{
        // WAJIB ditunggu (bukan bgSave) dan hasilnya dicek — supaya import massal seperti ini benar-benar dipastikan tersimpan ke server sebelum dianggap selesai.
        if(newUnits.length>0) await saveUnitList();
        await savePegawaiList();
        state.aiImportPreview = null;
        state.aiPdfPegawai = null;
        rerender();
        alert('✓ Berhasil disimpan ke server: '+newPegawai.length+' pegawai'+(newUnits.length?' + '+newUnits.length+' unit baru':'')+'.');
      }catch(err){
        // GAGAL tersimpan ke server — batalkan penambahan lokal supaya tidak memberi kesan palsu "sudah tersimpan"
        state.pegawai.splice(state.pegawai.length-newPegawai.length, newPegawai.length);
        state.units.splice(state.units.length-newUnits.length, newUnits.length);
        saveAllBtn.disabled = false; saveAllBtn.textContent = 'Simpan Semua ke Data Pegawai';
        rerender();
        alert('❌ GAGAL menyimpan ke server. Data BELUM tersimpan — silakan periksa koneksi internet dan coba lagi.\n\nDetail: '+(err && err.message ? err.message : err));
      }
    }},['Simpan Semua ke Data Pegawai']);
    actions.appendChild(saveAllBtn);
    prevPanel.appendChild(table);
    prevPanel.appendChild(actions);
    body.appendChild(prevPanel);
  }
}

async function runAIPenilaianBatch(staffList, narrative, pdfAttachment){
  const chunks = [];
  for(let i=0;i<staffList.length;i+=6) chunks.push(staffList.slice(i,i+6));
  let allResults = [];
  const kinerjaKeys = state.aspekConfig.kinerja.map(a=>a.key).join(', ');
  const mutuKeys = state.aspekConfig.mutu.map(a=>a.key).join(', ');
  for(const chunk of chunks){
    const staffLine = chunk.map(p=>p.id+' = '+p.nama).join(' | ');
    const sys = "Anda adalah asisten Manajer Unit RS yang membaca catatan kinerja bulanan (dan/atau dokumen PDF laporan absensi terlampir) untuk menyusun skor penilaian awal (skala 1-4: 1=Kurang,2=Cukup,3=Baik,4=Sangat Baik). Daftar pegawai unit ini (id = nama): "+staffLine+". Cocokkan ke pegawai berdasarkan nama yang disebut di teks maupun di dokumen PDF. Jika ada dokumen PDF berisi rekap absensi (SIMPEG), prioritaskan angka hadir/terlambat/alpha dari dokumen tersebut dibanding perkiraan dari teks. HANYA sertakan pegawai yang benar-benar disebutkan/tercantum. Kembalikan HANYA array JSON valid, tanpa penjelasan lain, format: [{\"id\":\"<id pegawai persis dari daftar>\",\"absensi\":{\"hadir_persen\":number,\"terlambat\":number,\"alpha\":number},\"kinerja\":{"+kinerjaKeys.split(', ').map(k=>'\"'+k+'\":number').join(',')+"},\"mutu\":{"+mutuKeys.split(', ').map(k=>'\"'+k+'\":number').join(',')+"},\"catatan\":\"ringkasan 1 kalimat alasan skor\"}]. Jika data absensi tidak disebutkan sama sekali, boleh diperkirakan wajar (hadir_persen 95-100, terlambat 0-1, alpha 0) dari nada catatan. Semua nilai skor wajib bilangan bulat 1-4.";
    const content = buildAIContent(narrative, pdfAttachment);
    const out = await callClaudeAI(sys, content);
    try{
      const parsed = parseAIJson(out);
      if(Array.isArray(parsed)) allResults = allResults.concat(parsed);
    }catch(e){ /* skip chunk on parse failure */ }
  }
  return allResults;
}

      }},['Hapus']));
      row.appendChild(top);

/* ============ REKAP & TUKIN ============ */
function exportRekapExcel(finals, periode){
  const rows = [
    ['REKAP PENILAIAN KINERJA & TUKIN — RSU ALLAM MEDICA'],
    ['Periode: '+periode],
    ['Dicetak: '+new Date().toLocaleString('id-ID')],
    [],
    ['Nama','Unit','Sikap Kerja','Kinerja Pelayanan','Mutu Pelayanan','Skor Akhir (%)','Grade','% Tukin','Nominal Tukin (Rp)','Status'],
  ];
  finals.forEach(({p,pn,f})=>{
    const nominal = pn.status==='FINAL' ? Math.round(Number(p.tukin_maks||0) * f.tier.persen/100) : '';
    rows.push([
      p.nama, unitName(p.unitId),
      f.sikapAvg!==null?Number(f.sikapAvg.toFixed(2)):'',
      f.kinerjaAvg!==null?Number(f.kinerjaAvg.toFixed(2)):'',
      f.mutuAvg!==null?Number(f.mutuAvg.toFixed(2)):'',
      pn.status==='FINAL'?Number(f.percent.toFixed(1)):'',
      pn.status==='FINAL'?f.tier.grade:'',
      pn.status==='FINAL'?f.tier.persen:'',
      nominal,
      STATUS_LABEL[pn.status]||pn.status,
    ]);
  });
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [{wch:26},{wch:16},{wch:11},{wch:14},{wch:12},{wch:13},{wch:8},{wch:9},{wch:16},{wch:16}];
  ws['!merges'] = [{s:{r:0,c:0},e:{r:0,c:9}},{s:{r:1,c:0},e:{r:1,c:9}},{s:{r:2,c:0},e:{r:2,c:9}}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Rekap Tukin');
  XLSX.writeFile(wb, 'Rekap-Tukin-'+periode.replace(/\s+/g,'-')+'.xlsx');
}

/** Panel generik untuk mengelola PIN suatu role (HRD/Diklat) — dipakai di menu Pengaturan. */
function buildRolePinPanel(roleKey, roleLabel, icon){
  const pinKey = roleKey+'Pin', authKey = roleKey+'Authed', editKey = roleKey+'PinEditing';
  const panel = el('div',{class:'panel'});
  panel.appendChild(el('h3',null,[icon+' Keamanan '+roleLabel]));
  if(state[pinKey]){
    panel.appendChild(el('div',{style:'background:var(--green-soft);color:var(--green);padding:8px 12px;border-radius:8px;font-size:12px;font-weight:600;margin-bottom:12px;'},['✓ PIN '+roleLabel+' aktif.']));
  } else {
    panel.appendChild(el('div',{class:'warn-note',style:'margin-bottom:12px;'},['PIN '+roleLabel+' belum diatur — siapa pun bisa memilih role ini tanpa proteksi.']));
  }
  if(state[editKey]){
    const oldInp = state[pinKey] ? el('input',{type:'password',placeholder:'PIN saat ini',style:'padding:8px 10px;border:1px solid var(--line);border-radius:7px;'}) : null;
    const newInp = el('input',{type:'password',placeholder:'PIN baru (angka, min. 4 digit)',style:'padding:8px 10px;border:1px solid var(--line);border-radius:7px;'});
    const confInp = el('input',{type:'password',placeholder:'Ulangi PIN baru',style:'padding:8px 10px;border:1px solid var(--line);border-radius:7px;'});
    const row = el('div',{style:'display:flex;gap:8px;flex-wrap:wrap;align-items:center;'});
    if(oldInp) row.appendChild(oldInp);
    row.appendChild(newInp); row.appendChild(confInp);
    const saveBtn = el('button',{class:'btn btn-primary btn-sm', onclick:()=>{
      if(state[pinKey] && oldInp.value !== state[pinKey]){ alert('PIN saat ini salah.'); return; }
      if(newInp.value.length<4){ alert('PIN baru minimal 4 digit.'); return; }
      if(newInp.value !== confInp.value){ alert('Konfirmasi PIN tidak cocok.'); return; }
      state[pinKey] = newInp.value;
      state[authKey] = true;
      state[editKey] = false;
      rerender();
      bgSave(saveAdminSecurity());
    }},[state[pinKey] ? 'Simpan PIN Baru' : 'Aktifkan PIN']);
    const cancelBtn = el('button',{class:'btn btn-outline btn-sm', onclick:()=>{ state[editKey]=false; rerender(); }},['Batal']);
    row.appendChild(saveBtn); row.appendChild(cancelBtn);
    panel.appendChild(row);
  } else {
    const btnRow = el('div',{style:'display:flex;gap:8px;'});
    btnRow.appendChild(el('button',{class:'btn btn-primary btn-sm', onclick:()=>{ state[editKey]=true; rerender(); }},[state[pinKey]?'Ubah PIN':'Aktifkan PIN']));
    if(state[pinKey]){
      btnRow.appendChild(el('button',{class:'btn btn-outline btn-sm', onclick:()=>{
        const check = prompt('Masukkan PIN '+roleLabel+' saat ini untuk menonaktifkan proteksi:');
        if(check===null) return;
        if(check !== state[pinKey]){ alert('PIN salah.'); return; }
        state[pinKey] = ''; rerender(); bgSave(saveAdminSecurity());
      }},['Nonaktifkan PIN']));
    }
    panel.appendChild(btnRow);
  }
  return panel;
}

function renderPengaturan(body){
  /* Perbaikan ID Duplikat — repair data lama yang mungkin rusak akibat bug generator ID sebelum diperbaiki */
  const dupPegawai = {};
  state.pegawai.forEach(p=>{ dupPegawai[p.id] = (dupPegawai[p.id]||0)+1; });
  const dupPegawaiIds = Object.keys(dupPegawai).filter(id=>dupPegawai[id]>1);
  const dupUnit = {};
  state.units.forEach(u=>{ dupUnit[u.id] = (dupUnit[u.id]||0)+1; });
  const dupUnitIds = Object.keys(dupUnit).filter(id=>dupUnit[id]>1);
  const totalDup = dupPegawaiIds.length + dupUnitIds.length;

  if(totalDup>0){
    const panelRepair = el('div',{class:'panel',style:'border-color:var(--red);'});
    panelRepair.appendChild(el('h3',{style:'color:var(--red);'},['⚠️ Ditemukan ID Bentrok/Duplikat']));
    panelRepair.appendChild(el('div',{class:'warn-note'},[
      'Terdeteksi '+dupPegawaiIds.length+' ID pegawai dan '+dupUnitIds.length+' ID unit yang dipakai lebih dari satu data sekaligus (kemungkinan besar dari impor massal sebelumnya) — ini bisa menyebabkan data pegawai/unit tertukar atau salah tampil. Klik tombol di bawah untuk memberikan ID baru yang unik ke data-data yang bentrok tersebut. Data (nama, unit, dsb.) TIDAK akan hilang, hanya ID di baliknya yang diperbaiki.'
    ]));
    panelRepair.appendChild(el('button',{class:'btn',style:'background:var(--red);color:#fff;', onclick: async ()=>{
      if(!confirm('Perbaiki '+totalDup+' ID yang bentrok sekarang? Proses ini aman dan tidak menghapus data.')) return;
      // Untuk tiap ID pegawai yang bentrok: pertahankan entri PERTAMA, beri ID baru untuk entri ke-2 dst.
      const seenPeg = new Set();
      state.pegawai.forEach(p=>{
        if(seenPeg.has(p.id)){ p.id = generateId('peg'); }
        seenPeg.add(p.id);
      });
      const seenUnit = new Set();
      const unitIdRemap = {}; // id lama -> id baru, untuk perbaiki referensi unitId di pegawai
      state.units.forEach(u=>{
        if(seenUnit.has(u.id)){ const oldId=u.id; u.id = generateId('unit'); unitIdRemap[oldId]=u.id; }
        seenUnit.add(u.id);
      });
      // Perbaiki juga referensi unitId di data pegawai yang tadinya menunjuk ke ID unit yang baru saja diganti
      if(Object.keys(unitIdRemap).length>0){
        state.pegawai.forEach(p=>{ if(p.unitId && unitIdRemap[p.unitId]) p.unitId = unitIdRemap[p.unitId]; });
      }
      rerender();
      bgSave(savePegawaiList()); bgSave(saveUnitList());
      alert('✓ Perbaikan selesai: '+dupPegawaiIds.length+' ID pegawai dan '+dupUnitIds.length+' ID unit sudah diberi ID baru yang unik.');
    }},['🔧 Perbaiki Sekarang ('+totalDup+' bentrok)']));
    body.appendChild(panelRepair);
  }


  /* Diagnostik Koneksi Server */
  if(STORAGE_MODE==='gas'){
    const panelDiag = el('div',{class:'panel',style:'border-color:var(--gold);'});
    panelDiag.appendChild(el('h3',null,['🔌 Tes Koneksi Server']));
    panelDiag.appendChild(el('div',{class:'small-note',style:'margin-bottom:12px;'},['Kirim data uji ke server Google Apps Script lalu ambil kembali, untuk memastikan data benar-benar tersimpan bersama (bukan cuma tersimpan lokal di perangkat ini).']));
    const diagBtn = el('button',{class:'btn btn-gold', disabled: state.diagBusy, onclick: async ()=>{
      state.diagBusy = true; state.diagLog = null; rerender();
      const log = await testGasConnection();
      state.diagBusy = false; state.diagLog = log; rerender();
    }},[state.diagBusy?'Menguji…':'Jalankan Tes Koneksi']);
    panelDiag.appendChild(diagBtn);
    if(state.diagLog){
      const box = el('div',{style:'margin-top:12px;background:#0B1E1C;color:#DCEAE7;border-radius:9px;padding:12px 14px;font-family:monospace;font-size:11.5px;white-space:pre-wrap;line-height:1.6;max-height:340px;overflow-y:auto;'});
      state.diagLog.forEach(line=>{
        const color = line.includes('✅')||line.includes('✓') ? '#8FE0B0' : (line.includes('⚠️')||line.includes('❌') ? '#F4B3AD' : '#DCEAE7');
        box.appendChild(el('div',{style:'color:'+color+';'},[line]));
      });
      panelDiag.appendChild(box);
    }
    body.appendChild(panelDiag);
  }

  /* Lokasi RS (Geofence) & Jadwal Kerja untuk Absen Mandiri */
  const panelGeo = el('div',{class:'panel'});
  panelGeo.appendChild(el('h3',null,['📍 Lokasi RS & Jadwal Kerja (untuk Absen Mandiri)']));
  panelGeo.appendChild(el('div',{class:'small-note',style:'margin-bottom:12px;'},['Titik koordinat ini dipakai untuk memvalidasi absen GPS pegawai — absen ditolak otomatis kalau di luar radius. Jam mulai kerja & toleransi dipakai untuk menghitung keterlambatan.']));

  const geoRow = el('div',{style:'display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px;'});
  const latInp = el('input',{type:'number',step:'0.000001',value:state.geofence.lat??'',placeholder:'Latitude',style:'width:150px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;'});
  const lngInp = el('input',{type:'number',step:'0.000001',value:state.geofence.lng??'',placeholder:'Longitude',style:'width:150px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;'});
  const radInp = el('input',{type:'number',value:state.geofence.radius,style:'width:100px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;'});
  const applyGeo = ()=>{
    state.geofence.lat = latInp.value?Number(latInp.value):null;
    state.geofence.lng = lngInp.value?Number(lngInp.value):null;
    state.geofence.radius = Number(radInp.value)||200;
    rerender(); bgSave(saveAbsensiConfig());
  };
  [latInp,lngInp,radInp].forEach(i=>i.addEventListener('change', applyGeo));
  geoRow.appendChild(el('div',{class:'field'},[el('label',null,['Latitude']), latInp]));
  geoRow.appendChild(el('div',{class:'field'},[el('label',null,['Longitude']), lngInp]));
  geoRow.appendChild(el('div',{class:'field'},[el('label',null,['Radius (meter)']), radInp]));
  geoRow.appendChild(el('button',{class:'btn btn-outline btn-sm', onclick:()=>{
    if(!navigator.geolocation){ alert('Perangkat ini tidak mendukung GPS.'); return; }
    navigator.geolocation.getCurrentPosition(pos=>{
      latInp.value = pos.coords.latitude.toFixed(6);
      lngInp.value = pos.coords.longitude.toFixed(6);
      applyGeo();
    }, err=>alert('Gagal mengambil lokasi: '+err.message));
  }},['📍 Pakai Lokasi Saat Ini']));
  panelGeo.appendChild(geoRow);
  if(state.geofence.lat==null) panelGeo.appendChild(el('div',{class:'warn-note'},['Lokasi RS belum diatur — absen GPS belum bisa memvalidasi radius (semua lokasi akan diterima). Berdirilah di area RS lalu klik "Pakai Lokasi Saat Ini".']));
  body.appendChild(panelGeo);

  /* Shift Kerja — jam kerja variatif per shift, ditautkan ke pegawai di menu Data Pegawai */
  const panelShift = el('div',{class:'panel'});
  panelShift.appendChild(el('h3',null,['⏰ Shift Kerja']));
  panelShift.appendChild(el('div',{class:'small-note',style:'margin-bottom:12px;'},['Atur jam mulai & toleransi keterlambatan untuk tiap shift. Tiap pegawai bisa diberi shift-nya masing-masing di menu Data Pegawai (kolom "Shift") — otomatis dipakai saat menghitung keterlambatan lewat "Isi dari Data Absensi Otomatis". Pegawai yang belum diberi shift memakai jam default di bawah tabel ini.']));

  state.shiftDefs.forEach((s,i)=>{
    const row = el('div',{style:'border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px;display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;'});
    const namaInp = el('input',{value:s.nama,style:'padding:7px 9px;border:1px solid var(--line);border-radius:7px;font-weight:700;width:120px;'});
    namaInp.addEventListener('change', e=>{ s.nama=e.target.value.trim()||s.nama; bgSave(saveAbsensiConfig()); rerender(); });
    const mulaiInp = el('input',{type:'time',value:s.jamMulai,style:'padding:7px 9px;border:1px solid var(--line);border-radius:7px;'});
    mulaiInp.addEventListener('change', e=>{ s.jamMulai=e.target.value; bgSave(saveAbsensiConfig()); });
    const selesaiInp = el('input',{type:'time',value:s.jamSelesai,style:'padding:7px 9px;border:1px solid var(--line);border-radius:7px;'});
    selesaiInp.addEventListener('change', e=>{ s.jamSelesai=e.target.value; bgSave(saveAbsensiConfig()); });
    const tolInp = el('input',{type:'number',value:s.toleransiMenit,style:'width:80px;padding:7px 9px;border:1px solid var(--line);border-radius:7px;'});
    tolInp.addEventListener('change', e=>{ s.toleransiMenit=Number(e.target.value)||0; bgSave(saveAbsensiConfig()); });
