<style>
:root{
  --ink:#152524;
  --ink-soft:#4A5D5B;
  --paper:#F4F6F4;
  --card:#FFFFFF;
  --line:#DCE3DF;
  --teal:#0B4F4A;

  --gold:#B8862E;
  --gold-soft:#F6ECD8;

  --red-soft:#FAE6E4;
  --green:#2E7D4F;

  --amber:#9A6B15;
  --amber-soft:#FBF0DB;

}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;line-height:1.5;}
h1,h2,h3,h4{font-family:'Lexend',sans-serif;margin:0;color:var(--teal-deep);}
button{font-family:inherit;cursor:pointer;}
.app{display:flex;min-height:100vh;}

/* Sidebar */
.sidebar{width:230px;background:var(--teal-deep);color:#DCEAE7;flex-shrink:0;display:flex;flex-direction:column;padding:22px 0;}
.brand{padding:0 20px 20px;border-bottom:1px solid rgba(255,255,255,0.12);margin-bottom:14px;}
.brand-mark{width:38px;height:38px;border-radius:9px;background:linear-gradient(135deg,var(--gold),#8f6a1f);display:flex;align-items:center;justify-content:center;font-family:'Lexend';font-weight:800;color:var(--teal-deep);font-size:15px;margin-bottom:10px;}
.brand h1{color:#fff;font-size:16px;letter-spacing:0.2px;}
.brand p{margin:3px 0 0;font-size:11px;color:#9FC1BC;}
.nav{flex:1;display:flex;flex-direction:column;gap:2px;padding:6px 12px;}
.nav button{background:none;border:none;text-align:left;color:#B9D3CF;padding:10px 12px;border-radius:8px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:10px;}
.nav button:hover{background:rgba(255,255,255,0.06);color:#fff;}

.role-box{margin:14px 12px 0;padding:12px;background:rgba(255,255,255,0.06);border-radius:10px;}

/* Main */
.main{flex:1;padding:26px 34px;max-width:1180px;}

<div id="root" class="loading">Memuat sistem…</div>

<script>
/* ============ KONFIGURASI DASAR (nilai default, dapat diubah admin di Kelola Aspek Penilaian) ============ */
const DEFAULT_SIKAP_ASPEK = [
  {key:'kehadiran', nama:'Kehadiran', desc:'Persentase kehadiran terhadap hari kerja efektif', type:'auto'},
  {key:'ketepatan_waktu', nama:'Ketepatan Waktu', desc:'Frekuensi keterlambatan datang / pulang cepat', type:'auto'},
  {key:'kepatuhan_izin', nama:'Kepatuhan Izin/Cuti', desc:'Izin & cuti sesuai prosedur, tanpa alpha', type:'auto'},
  {key:'kedisiplinan', nama:'Kedisiplinan', desc:'Bebas dari Surat Peringatan / pelanggaran tata tertib', type:'auto'},
];
const DEFAULT_KINERJA_ASPEK = [
  {key:'produktivitas', nama:'Produktivitas Kerja', desc:'Pencapaian target/beban kerja unit', type:'manual'},
  {key:'kualitas_hasil', nama:'Kualitas Hasil Kerja', desc:'Ketelitian dan mutu pekerjaan yang dihasilkan', type:'manual'},
  {key:'ketepatan_tugas', nama:'Ketepatan Waktu Tugas', desc:'Penyelesaian tugas sesuai target waktu', type:'manual'},
  {key:'inisiatif', nama:'Inisiatif & Tanggung Jawab', desc:'Proaktif menyelesaikan masalah kerja', type:'manual'},
  {key:'kerjasama', nama:'Kerjasama Tim', desc:'Kolaborasi dengan rekan kerja & unit lain', type:'manual'},
];
const DEFAULT_MUTU_ASPEK = [
  {key:'skp', nama:'Kepatuhan SKP', desc:'Sasaran Keselamatan Pasien', type:'manual'},
  {key:'ppi', nama:'Kepatuhan PPI', desc:'Pencegahan & Pengendalian Infeksi', type:'manual'},
  {key:'ikp', nama:'Ketepatan Pelaporan IKP', desc:'Insiden Keselamatan Pasien sesuai SPO & waktu', type:'manual'},
  {key:'komplain', nama:'Penanganan Komplain', desc:'Jumlah & penanganan keluhan pelanggan', type:'manual'},
  {key:'kepuasan', nama:'Kepuasan Pasien thd Unit', desc:'Hasil survei kepuasan pasien terkait unit/petugas', type:'manual'},
];
const SCORE_LABEL = {1:'Kurang',2:'Cukup',3:'Baik',4:'Sangat Baik'};
const DEFAULT_WEIGHT = {sikap:30, kinerja:40, mutu:30};
function equalSplit(list){ const p=Math.round(100/list.length); const o={}; list.forEach((a,i)=>o[a.key]= i===list.length-1 ? (100-p*(list.length-1)) : p); return o; }
const DEFAULT_SUBWEIGHT = { sikap: equalSplit(DEFAULT_SIKAP_ASPEK), kinerja: equalSplit(DEFAULT_KINERJA_ASPEK), mutu: equalSplit(DEFAULT_MUTU_ASPEK) };
// Ambang batas skor otomatis Sikap Kerja (bisa diubah admin di menu Pengaturan → Ambang Batas Sikap Kerja)
const DEFAULT_SIKAP_THRESHOLDS = {
  kehadiran:       {higherBetter:true,  unit:'%',    t4:98, t3:95, t2:90}, // % kehadiran — makin tinggi makin baik
  ketepatan_waktu: {higherBetter:false, unit:'kali', t4:0,  t3:2,  t2:5},  // jumlah terlambat — makin rendah makin baik
  kepatuhan_izin:  {higherBetter:false, unit:'hari', t4:0,  t3:1,  t2:2},  // jumlah alpha/tanpa keterangan — makin rendah makin baik
  kedisiplinan:    {higherBetter:false, unit:'SP',   t4:0,  t3:1,  t2:2},  // jumlah Surat Peringatan aktif — makin rendah makin baik
};
const DEFAULT_TIERS = [
  {grade:'A', min:90, persen:100},
  {grade:'B', min:80, persen:90},
  {grade:'C', min:70, persen:75},
  {grade:'D', min:60, persen:50},
  {grade:'E', min:0,  persen:25},
];
const STATUS_FLOW = ['DRAFT','DIAJUKAN','VALIDASI_HRD','FINAL'];
const STATUS_LABEL = {
  DRAFT:'Draft', DIAJUKAN:'Diajukan', VALIDASI_HRD:'Divalidasi HRD', REVISI_HRD:'Revisi (HRD)',
  VALIDASI_DIKLAT:'Divalidasi Diklat', REVISI_DIKLAT:'Revisi (Diklat)', FINAL:'Final'
};

/* ============ AI HELPER (Claude API) ============ */
async function callClaudeAI(systemPrompt, userContent){
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      system: systemPrompt,
      messages: [{ role: "user", content: userContent }],
    })
  });
  const data = await response.json();
  if(data.error) throw new Error(data.error.message || 'AI error');
  const text = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
  return text;
}
function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result.split(',')[1]);
    r.onerror = ()=>reject(new Error('Gagal membaca file'));
    r.readAsDataURL(file);
  });
}
function buildAIContent(text, pdfAttachment){
  // pdfAttachment: {base64, name} or null
  if(!pdfAttachment) return text;
  const blocks = [{type:'document', source:{type:'base64', media_type:'application/pdf', data: pdfAttachment.base64}}];
  if(text && text.trim()) blocks.push({type:'text', text: text.trim()});
  else blocks.push({type:'text', text:'Baca dokumen terlampir dan ekstrak datanya sesuai instruksi.'});
  return blocks;
}
function parseAIJson(text){
  let clean = text.trim().replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
  const start = clean.indexOf('['); const startObj = clean.indexOf('{');
  // try array first, else object
  try{ return JSON.parse(clean); }catch(e){}
  if(start>=0){ try{ return JSON.parse(clean.slice(start, clean.lastIndexOf(']')+1)); }catch(e){} }
  if(startObj>=0){ try{ return JSON.parse(clean.slice(startObj, clean.lastIndexOf('}')+1)); }catch(e){} }
  throw new Error('Gagal membaca hasil AI. Coba lagi atau periksa format teks yang ditempel.');
}

/* ============ STORAGE WRAPPER ============ */
// Prioritas mode penyimpanan:
// 1) 'gas'   — kalau GAS_WEBAPP_URL diisi: data disimpan di Google Sheets lewat Apps Script,
//              bisa diakses dari perangkat manapun (mode yang dipakai untuk lintas perangkat).
// 2) 'cloud' — kalau dibuka lewat link chat Claude, window.storage tersedia otomatis.
// 3) 'local' — fallback terakhir: localStorage di perangkat ini saja.
//
// CARA AKTIFKAN MODE LINTAS PERANGKAT:
// Deploy backend (lihat file Code.gs yang disertakan terpisah) sebagai Google Apps Script
// Web App, lalu tempel URL hasil deploy-nya (diakhiri /exec) di baris di bawah ini.
const GAS_WEBAPP_URL = ''; // <-- tempel URL Web App Apps Script Anda di sini, lalu simpan ulang file ini

const LS_PREFIX = 'simkin_rs_';
const STORAGE_MODE = GAS_WEBAPP_URL ? 'gas'
  : ((typeof window !== 'undefined' && typeof window.storage !== 'undefined' && window.storage !== null) ? 'cloud' : 'local');

async function gasFetch(params, isPost, body){
  const url = GAS_WEBAPP_URL + (isPost ? '' : ('?' + new URLSearchParams(params).toString()));
  const opts = isPost
    ? { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body) }
    : { method:'GET' };
  const res = await fetch(url, opts);
  return await res.json();
}

const Storage = {
  async get(key, shared){
    if(STORAGE_MODE==='gas'){
      try{ const r = await gasFetch({action:'get', key}); return r.value!==undefined && r.value!==null && r.value!=='' ? {key, value:r.value, shared} : null; }
      catch(e){ /* jatuhkan ke lokal */ }
    } else if(STORAGE_MODE==='cloud'){
      try{ return await window.storage.get(key, shared); }catch(e){ /* jatuhkan ke lokal */ }
    }
    try{
      const raw = window.localStorage.getItem(LS_PREFIX+key);
      return raw!==null ? {key, value:raw, shared} : null;
    }catch(e){ return null; }
  },
  async set(key, value, shared){
    if(STORAGE_MODE==='gas'){
      try{ await gasFetch(null, true, {action:'set', key, value}); return {key, value, shared}; }
      catch(e){ /* jatuhkan ke lokal */ }
    } else if(STORAGE_MODE==='cloud'){
      try{ return await window.storage.set(key, value, shared); }catch(e){ /* jatuhkan ke lokal */ }
    }
    try{
      window.localStorage.setItem(LS_PREFIX+key, value);
      return {key, value, shared};
    }catch(e){ return null; }
  },
  async delete(key, shared){
    if(STORAGE_MODE==='gas'){
      try{ await gasFetch(null, true, {action:'delete', key}); return {key, deleted:true, shared}; }
      catch(e){}
    } else if(STORAGE_MODE==='cloud'){
      try{ return await window.storage.delete(key, shared); }catch(e){}
    }
    try{
      window.localStorage.removeItem(LS_PREFIX+key);
      return {key, deleted:true, shared};
    }catch(e){ return null; }
  },
  async list(prefix, shared){
    if(STORAGE_MODE==='gas'){
      try{ const r = await gasFetch({action:'list', prefix: prefix||''}); return {keys: r.keys||[], prefix, shared}; }
      catch(e){}
    } else if(STORAGE_MODE==='cloud'){
      try{ return await window.storage.list(prefix, shared); }catch(e){}
    }
    try{
      const keys = [];
      for(let i=0;i<window.localStorage.length;i++){
        const k = window.localStorage.key(i);
        if(k && k.indexOf(LS_PREFIX)===0){
          const realKey = k.slice(LS_PREFIX.length);
          if(!prefix || realKey.indexOf(prefix)===0) keys.push(realKey);
        }
      }
      return {keys, prefix, shared};
    }catch(e){ return {keys:[]}; }
  }
};

/* ============ STATE ============ */
let state = {
  role: 'unit',
  tab: 'dashboard',
  periode: null,
  periodeList: [],
  pegawai: [],
  units: [], // {id, nama}
  currentUnitId: null,
  penilaian: {}, // key: periode|pegawaiId -> object
  weight: DEFAULT_WEIGHT,       // bobot komponen default (global)
  subWeight: DEFAULT_SUBWEIGHT, // bobot sub-aspek per komponen (global)
  aspekConfig: { sikap: JSON.parse(JSON.stringify(DEFAULT_SIKAP_ASPEK)), kinerja: JSON.parse(JSON.stringify(DEFAULT_KINERJA_ASPEK)), mutu: JSON.parse(JSON.stringify(DEFAULT_MUTU_ASPEK)) }, // daftar aspek penilaian per komponen — dapat ditambah/diubah admin
  sikapThresholds: JSON.parse(JSON.stringify(DEFAULT_SIKAP_THRESHOLDS)), // ambang batas skor otomatis Sikap Kerja — dapat diubah admin
  adminPin: '', // PIN akses admin (kosong = belum diaktifkan)
  adminAuthed: false, // status login admin pada sesi ini (di memori)
  adminLoginError: null,
  adminPinEditing: false,
  geofence: { lat:null, lng:null, radius:200 }, // titik referensi RS + radius (meter) untuk absen GPS
  shiftConfig: { jamMulai:'07:00', toleransiMenit:15 }, // jam mulai kerja & toleransi keterlambatan untuk hitung "terlambat"
  myPegawaiId: null, // identitas pegawai pemilik perangkat ini (mode Absen Mandiri) — disimpan lokal per perangkat
  absensiToday: null, // cache status absen hari ini {masuk, pulang}
  absensiBusy: false,
  absensiMsg: null,
  perUnitWeight: {},            // {unitId: {sikap,kinerja,mutu}} - override per unit, opsional
  tiers: DEFAULT_TIERS,
  loaded: false,
  modal: null, // {type, pegawaiId}
  aiImportPreview: null, // for pegawai bulk import preview
  aiPenilaianResult: null, // for monthly AI-assisted assessment results
  aiBusy: false,
  aiError: null,
  aiPdfPegawai: null, // {base64, name}
  aiPdfBulanan: null, // {base64, name}
  absenManageOpen: false,
  pinSetupOpen: false,
  unitAuth: {}, // {unitId: true} - status login unit pada sesi ini (di memori, reset saat halaman dimuat ulang)
  unitLoginError: null,
  unitSaveConfirm: null, // teks konfirmasi "Tersimpan pada ..." di menu Data Unit
};

function unitName(id){ const u = state.units.find(x=>x.id===id); return u? u.nama : '-'; }
function weightForUnit(unitId){
  const ov = state.perUnitWeight[unitId];
  if(ov && ov.enabled) return {sikap:ov.sikap, kinerja:ov.kinerja, mutu:ov.mutu};
  return state.weight;
}
function unitNeedsLogin(unitId){
  const u = state.units.find(x=>x.id===unitId);
  return !!(u && u.password && !state.unitAuth[unitId]);
}

function pnKey(periode, pegawaiId){ return periode+'::'+pegawaiId; }

/* ============ STORAGE ============ */
async function loadAll(){
  try{
    const p = await Storage.get('pegawai-list', true);
    state.pegawai = p ? JSON.parse(p.value) : [];
  }catch(e){ state.pegawai = []; }

  try{
    const pl = await Storage.get('periode-list', true);
    state.periodeList = pl ? JSON.parse(pl.value) : [];
  }catch(e){ state.periodeList = []; }

  if(state.periodeList.length===0){
    const now = new Date();
    const def = now.toLocaleString('id-ID',{month:'long',year:'numeric'});

/* ============ ABSEN MANDIRI: GPS + SIDIK JARI (WebAuthn) ============ */
function arrBufToB64(buf){
  let bin=''; const bytes = new Uint8Array(buf);
  for(let i=0;i<bytes.byteLength;i++) bin += String.fromCharCode(bytes[i]);
  return window.btoa(bin);
}
function b64ToArrBuf(b64){
  const bin = window.atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return bytes.buffer;
}
function webauthnSupported(){
  return typeof window!=='undefined' && !!window.PublicKeyCredential && !!navigator.credentials && window.isSecureContext;
}
async function registerFingerprint(pegawaiId, pegawaiNama){
  if(!webauthnSupported()) throw new Error('Perangkat/browser ini tidak mendukung verifikasi sidik jari (WebAuthn), atau halaman tidak dibuka lewat alamat https:// yang aman.');
  const challenge = crypto.getRandomValues(new Uint8Array(32));
  const userId = new TextEncoder().encode(pegawaiId);
  const cred = await navigator.credentials.create({
    publicKey: {
      challenge,
      rp: { name: 'SIMKIN-RS Absen Mandiri' },
      user: { id: userId, name: pegawaiId, displayName: pegawaiNama },
      pubKeyCredParams: [{type:'public-key', alg:-7}, {type:'public-key', alg:-257}],
      authenticatorSelection: { authenticatorAttachment:'platform', userVerification:'required', residentKey:'preferred' },
      timeout: 60000,
      attestation: 'none'
    }
  });
  const credId = arrBufToB64(cred.rawId);
  window.localStorage.setItem('simkin_fp_'+pegawaiId, credId);
  return credId;
}
function fingerprintRegistered(pegawaiId){
  try{ return !!window.localStorage.getItem('simkin_fp_'+pegawaiId); }catch(e){ return false; }
}
async function verifyFingerprint(pegawaiId){
  if(!webauthnSupported()) throw new Error('Perangkat/browser ini tidak mendukung verifikasi sidik jari (WebAuthn), atau halaman tidak dibuka lewat alamat https:// yang aman.');
  const credId = window.localStorage.getItem('simkin_fp_'+pegawaiId);
  if(!credId) throw new Error('Sidik jari belum didaftarkan di perangkat ini.');
  const challenge = crypto.getRandomValues(new Uint8Array(32));
  const assertion = await navigator.credentials.get({
    publicKey: {
      challenge,
      allowCredentials: [{ id: b64ToArrBuf(credId), type:'public-key' }],
      userVerification: 'required',
      timeout: 60000
    }
  });
  return !!assertion;
}
/* ---- PIN Absen: metode verifikasi kedua/cadangan, tersimpan lokal per perangkat ---- */
function pinRegistered(pegawaiId){
  try{ return !!window.localStorage.getItem('simkin_pin_'+pegawaiId); }catch(e){ return false; }
}
function setAbsenPin(pegawaiId, pin){
  window.localStorage.setItem('simkin_pin_'+pegawaiId, pin);
}
function removeAbsenPin(pegawaiId){
  window.localStorage.removeItem('simkin_pin_'+pegawaiId);
}
function verifyAbsenPin(pegawaiId, inputPin){
  const stored = window.localStorage.getItem('simkin_pin_'+pegawaiId);
  return stored !== null && stored === inputPin;
}
/** Verifikasi identitas gabungan: coba sidik jari dulu (kalau terdaftar), kalau gagal/tidak tersedia dan PIN
 * juga terdaftar, otomatis tawarkan PIN sebagai cadangan. */
async function verifyIdentityForAbsen(pegawaiId){
  const hasFp = fingerprintRegistered(pegawaiId);
  const hasPin = pinRegistered(pegawaiId);
  if(!hasFp && !hasPin) throw new Error('Verifikasi belum diatur di perangkat ini. Daftarkan sidik jari atau PIN Absen terlebih dahulu.');

  if(hasFp){
    try{
      const ok = await verifyFingerprint(pegawaiId);
      if(ok) return true;
    }catch(e){
      if(!hasPin) throw e; // tidak ada metode cadangan, gagal total
      // sidik jari gagal/tidak terdeteksi — lanjut coba PIN di bawah
    }
  }
  if(hasPin){
    const input = prompt('Sidik jari tidak terdeteksi. Masukkan PIN Absen Anda:');
    if(input===null) throw new Error('Absen dibatalkan.');
    if(!verifyAbsenPin(pegawaiId, input)) throw new Error('PIN salah.');
    return true;
  }
  throw new Error('Verifikasi gagal.');
}
function getCurrentLocation(){
  return new Promise((resolve,reject)=>{
    if(!navigator.geolocation){ reject(new Error('Perangkat ini tidak mendukung GPS/lokasi.')); return; }
    navigator.geolocation.getCurrentPosition(
      pos=>resolve({lat:pos.coords.latitude, lng:pos.coords.longitude, akurasi:pos.coords.accuracy}),
      err=>reject(new Error('Gagal mengambil lokasi: '+err.message+'. Pastikan izin lokasi diaktifkan.')),
      {enableHighAccuracy:true, timeout:15000, maximumAge:0}
    );
  });
}
function distanceMeters(lat1,lng1,lat2,lng2){
  const R=6371000, toRad=d=>d*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLng=toRad(lng2-lng1);
  const a=Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
async function getAbsensiLog(pegawaiId, dateISO){
  try{
    const r = await Storage.get('absensi-log:'+pegawaiId+':'+dateISO, true);
    return r ? JSON.parse(r.value) : {};
  }catch(e){ return {}; }
}

async function doAbsen(pegawaiId, jenis){ // jenis: 'masuk' | 'pulang'
  const loc = await getCurrentLocation();
  if(state.geofence.lat!=null && state.geofence.lng!=null){
    const jarak = distanceMeters(loc.lat, loc.lng, state.geofence.lat, state.geofence.lng);
    if(jarak > state.geofence.radius){
      throw new Error('Anda berada di luar radius lokasi RS (jarak ±'+Math.round(jarak)+' m, batas '+state.geofence.radius+' m). Absen ditolak.');
    }
  }
  const verified = await verifyIdentityForAbsen(pegawaiId);
  if(!verified) throw new Error('Verifikasi identitas gagal.');
  const dateISO = todayISO();
  const log = await getAbsensiLog(pegawaiId, dateISO);
  const now = new Date();
  const jam = now.toTimeString().slice(0,5);
  log[jenis] = { jam, lat:loc.lat, lng:loc.lng };
  await saveAbsensiLog(pegawaiId, dateISO, log);
  return log;
}
/** Menghitung ringkasan absensi (untuk dipakai mengisi Sikap Kerja) dari log harian dalam rentang tanggal. */
async function computeAttendanceSummary(pegawaiId, startISO, endISO){
  const start = new Date(startISO), end = new Date(endISO);
  const [jamH, menitH] = state.shiftConfig.jamMulai.split(':').map(Number);
  let totalHari=0, hadirHari=0, terlambatHari=0, alphaHari=0;
  for(let d=new Date(start); d<=end; d.setDate(d.getDate()+1)){
    const iso = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if(new Date(iso) > new Date(todayISO())) break; // jangan hitung hari yang belum terjadi
    totalHari++;
    const log = await getAbsensiLog(pegawaiId, iso);
    if(log.masuk){
      hadirHari++;
      const [jm, mm] = log.masuk.jam.split(':').map(Number);
      const menitMasuk = jm*60+mm, menitBatas = jamH*60+menitH+state.shiftConfig.toleransiMenit;
      if(menitMasuk > menitBatas) terlambatHari++;
    } else {
      alphaHari++;
    }
  }
  const hadir_persen = totalHari>0 ? Math.round((hadirHari/totalHari)*1000)/10 : 100;
  return { hadir_persen, terlambat:terlambatHari, alpha:alphaHari, totalHari, hadirHari };
}

function slugify(nama){
  return 'asp_'+nama.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,30)+'_'+Math.floor(Math.random()*10000);
}
function addAspek(compKey, nama, desc, type){
  const key = slugify(nama||'aspek');
  state.aspekConfig[compKey].push({key, nama:nama.trim(), desc:(desc||'').trim(), type: type||'manual'});
  // beri bobot default merata ulang agar totalnya tetap masuk akal
  const n = state.aspekConfig[compKey].length;
  const even = Math.floor(100/n);
  const w = {};
  state.aspekConfig[compKey].forEach((a,i)=> w[a.key] = i===n-1 ? (100-even*(n-1)) : even);
  state.subWeight[compKey] = w;
  return key;
}
function removeAspek(compKey, key){
  state.aspekConfig[compKey] = state.aspekConfig[compKey].filter(a=>a.key!==key);
  delete state.subWeight[compKey][key];
  // ratakan ulang bobot yang tersisa agar tetap total 100
  const remaining = state.aspekConfig[compKey];
  if(remaining.length>0){
    const n = remaining.length;
    const even = Math.floor(100/n);
    const w = {};
    remaining.forEach((a,i)=> w[a.key] = i===n-1 ? (100-even*(n-1)) : even);
    state.subWeight[compKey] = w;
  }
}

/* ============ SCORING LOGIC ============ */
function tierScore(value, t){
  if(t.higherBetter){
    if(value>=t.t4) return 4;
    if(value>=t.t3) return 3;
    if(value>=t.t2) return 2;
    return 1;
  } else {
    if(value<=t.t4) return 4;
    if(value<=t.t3) return 3;
    if(value<=t.t2) return 2;
    return 1;
  }
}
function computeSikapFromAbsensi(ab){
  const th = state.sikapThresholds;
  return {
    kehadiran: tierScore(ab.hadir_persen, th.kehadiran),
    ketepatan_waktu: tierScore(ab.terlambat, th.ketepatan_waktu),
    kepatuhan_izin: tierScore(ab.alpha, th.kepatuhan_izin),
    kedisiplinan: tierScore(ab.sp_aktif, th.kedisiplinan),
  };
}

function avgScore(scoreObj, aspekList, subW){
  const entries = aspekList.filter(a=>typeof scoreObj[a.key]==='number');
  if(entries.length===0) return null;
  let wsum=0, total=0;
  entries.forEach(a=>{
    const w = (subW && typeof subW[a.key]==='number') ? subW[a.key] : (100/aspekList.length);
    wsum += w; total += scoreObj[a.key]*w;
  });
  if(wsum===0) return null;
  return total/wsum;
}

function computeFinal(pn, unitId){
  const sikapAuto = computeSikapFromAbsensi(pn.absensi);
  const sikapCombined = {...sikapAuto, ...(pn.sikap_score||{})}; // gabung skor otomatis (absensi) + skor manual (aspek tambahan)
  const sikapAvg = avgScore(sikapCombined, state.aspekConfig.sikap, state.subWeight.sikap);
  const kinerjaAvg = avgScore(pn.kinerja_score, state.aspekConfig.kinerja, state.subWeight.kinerja);
  const mutuAvg = avgScore(pn.mutu_score, state.aspekConfig.mutu, state.subWeight.mutu);
  const w = weightForUnit(unitId);
  const totalW = (w.sikap+w.kinerja+w.mutu)||100;
  let weighted = 0, wsum=0;
  if(sikapAvg!==null){ weighted += (sikapAvg/4)*w.sikap; wsum+=w.sikap; }
  if(kinerjaAvg!==null){ weighted += (kinerjaAvg/4)*w.kinerja; wsum+=w.kinerja; }
  if(mutuAvg!==null){ weighted += (mutuAvg/4)*w.mutu; wsum+=w.mutu; }
  const percent = wsum>0 ? (weighted/totalW)*100 : 0;
  let tier = state.tiers.slice().sort((a,b)=>b.min-a.min).find(t=>percent>=t.min) || state.tiers[state.tiers.length-1];
  return {sikapAuto, sikapCombined, sikapAvg, kinerjaAvg, mutuAvg, percent, tier, weightUsed:w, complete: sikapAvg!==null && kinerjaAvg!==null && mutuAvg!==null};
}

/* ============ RENDER HELPERS ============ */
function el(tag, attrs, children){
  const e = document.createElement(tag);
  const BOOL_PROPS = {disabled:1, checked:1, selected:1, readOnly:1, required:1};
  if(attrs) for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.startsWith('on')) e.addEventListener(k.substring(2), attrs[k]);
    else if(BOOL_PROPS[k]) e[k] = !!attrs[k]; // atribut boolean HTML: harus lewat properti DOM, bukan setAttribute (setAttribute('disabled', false) tetap menonaktifkan elemen!)
    else e.setAttribute(k, attrs[k]);
  }
  (children||[]).forEach(c=>{ if(c) e.appendChild(typeof c==='string'?document.createTextNode(c):c); });
  return e;
}

    unit_master:['Data Unit','Kelola daftar unit/ruangan rumah sakit'],
    input:['Input Penilaian','Sikap Kerja (absensi), Kinerja Pelayanan & Mutu Pelayanan — Unit '+unitName(state.currentUnitId)],
    input_ai:['Input Bulanan (AI)','Tempel catatan/laporan bulanan unit, AI bantu susun skor awal — Unit '+unitName(state.currentUnitId)],
    pegawai_ai:['Input Pegawai (AI)','Tempel data pegawai dari sumber manapun, AI bantu merapikan ke format sistem'],
    aspek_master:['Aspek Penilaian','Sesuaikan daftar aspek penilaian dengan regulasi/akreditasi rumah sakit (KARS, dsb)'],
    absen:['Absen Mandiri','Verifikasi lokasi & sidik jari untuk absen masuk/pulang'],
    validasi_hrd:['Validasi HRD','Verifikasi data Sikap Kerja berbasis absensi'],
    validasi_diklat:['Validasi Diklat','Verifikasi Kinerja Pelayanan & Mutu Pelayanan'],
    rekap:['Rekap & Tukin','Hasil akhir penilaian & persentase tukin — seluruh unit'],
    pengaturan:['Pengaturan Bobot','Bobot komponen, sub-aspek, & bobot khusus per unit'],
  };
  const t = titles[state.tab]||['','']
  topbar.appendChild(el('div',null,[ el('h2',null,[t[0]]), el('div',{class:'sub'},[t[1]]) ]));

  const periodeBox = el('div',{class:'periode-box'},[el('label',null,['Periode'])]);
  const pSel = el('select',{onchange: async (e)=>{
    if(e.target.value==='__new__'){
      const np = prompt('Nama periode baru (contoh: September 2026):');
      if(np && !state.periodeList.includes(np)){
        state.periodeList.push(np); bgSave(savePeriodeList());
        state.periode = np;
        await loadPenilaianForPeriode(np);
      }
    } else {
      state.periode = e.target.value;
      await loadPenilaianForPeriode(state.periode);
    }
    rerender();
  }});
  state.periodeList.forEach(pr=>{ const o=el('option',{value:pr},[pr]); if(pr===state.periode) o.selected=true; pSel.appendChild(o); });
  pSel.appendChild(el('option',{value:'__new__'},['+ Tambah periode baru']));
  periodeBox.appendChild(pSel);
  topbar.appendChild(periodeBox);
  main.appendChild(topbar);

  const body = el('div',{id:'body'});
  main.appendChild(body);
  const modeNote = STORAGE_MODE==='gas'
    ? 'Tersambung ke server bersama (Google Sheets) — data dapat diakses lintas perangkat oleh Kepala Unit, HRD, Diklat, dan Admin.'
    : STORAGE_MODE==='cloud'
    ? 'Data tersimpan otomatis dan dapat diakses bersama oleh Kepala Unit, HRD, Diklat, dan Admin.'
    : '⚠️ Mode Lokal — file ini dibuka langsung di luar chat Claude tanpa server bersama, jadi data hanya tersimpan di perangkat & browser ini saja. Untuk akses lintas perangkat, aktifkan koneksi server (lihat GAS_WEBAPP_URL) atau buka lewat link chat Claude.';
  main.appendChild(el('div',{class:'footer-note',style: STORAGE_MODE!=='local' ? '' : 'color:var(--amber);font-weight:600;max-width:600px;margin-left:auto;margin-right:auto;'},[modeNote]));
  app.appendChild(main);

  root.appendChild(app);

  if(state.role==='unit' && state.currentUnitId && unitNeedsLogin(state.currentUnitId)){
    renderUnitLogin(body);
  } else if(state.role==='admin' && state.adminPin && !state.adminAuthed){
    renderAdminLogin(body);
  } else {
    await renderTab(body);
  }

  if(state.modal) renderModal();
}

async function renderTab(body){
  if(state.tab==='dashboard') return renderDashboard(body);
  if(state.tab==='pegawai') return renderPegawai(body);
  if(state.tab==='unit_master') return renderUnitMaster(body);
  if(state.tab==='input') return renderInput(body);
  if(state.tab==='input_ai') return renderInputAI(body);
  if(state.tab==='pegawai_ai') return renderPegawaiAI(body);
  if(state.tab==='aspek_master') return renderAspekMaster(body);
  if(state.tab==='absen') return renderAbsenMandiri(body);
  if(state.tab==='validasi_hrd') return renderValidasiHRD(body);
  if(state.tab==='validasi_diklat') return renderValidasiDiklat(body);
  if(state.tab==='rekap') return renderRekap(body);
  if(state.tab==='pengaturan') return renderPengaturan(body);
}

/* ============ ABSEN MANDIRI (GPS + Sidik Jari) ============ */
function buildFingerprintCard(me){
  const registered = fingerprintRegistered(me.id);
  const box = el('div',{style:'border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;'});
  const head = el('div',{style:'display:flex;justify-content:space-between;align-items:center;'});
  head.appendChild(el('div',null,[
    el('div',{style:'font-weight:700;font-family:Lexend;font-size:13px;'},['🔒 Sidik Jari (sensor HP)']),
    el('div',{style:'font-size:11px;color:var(--ink-soft);margin-top:2px;'},[registered ? 'Sudah terdaftar di perangkat ini.' : 'Pakai sensor sidik jari bawaan HP — paling praktis.'])
  ]));
  head.appendChild(el('span',{class:'chip', style: registered?'background:var(--green-soft);color:var(--green);':''},[registered?'Aktif':'Belum']));
  box.appendChild(head);
  box.appendChild(el('button',{class:'btn btn-outline btn-sm',style:'margin-top:10px;width:100%;', disabled: !webauthnSupported() || state.absensiBusy, onclick: async ()=>{
    state.absensiBusy = true; state.absensiMsg=null; rerender();
    try{
      await registerFingerprint(me.id, me.nama);
      state.absensiMsg = {ok:true, text:'✓ Sidik jari berhasil didaftarkan di perangkat ini.'};
    }catch(e){
      state.absensiMsg = {ok:false, text: e.message||'Gagal mendaftarkan sidik jari.'};
    }
    state.absensiBusy = false; rerender();
  }},[registered ? 'Daftar Ulang Sidik Jari' : 'Daftarkan Sidik Jari']));
  if(!webauthnSupported()) box.appendChild(el('div',{class:'small-note',style:'margin-top:6px;'},['Tidak tersedia di perangkat/browser ini saat ini — pakai PIN sebagai gantinya.']));
  return box;
}

function buildPinCard(me){
  const registered = pinRegistered(me.id);
  const box = el('div',{style:'border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;'});
  const head = el('div',{style:'display:flex;justify-content:space-between;align-items:center;'});
  head.appendChild(el('div',null,[
    el('div',{style:'font-weight:700;font-family:Lexend;font-size:13px;'},['🔢 PIN Absen']),
    el('div',{style:'font-size:11px;color:var(--ink-soft);margin-top:2px;'},[registered ? 'Sudah diatur di perangkat ini.' : 'Cadangan kalau sidik jari tidak terdeteksi.'])
  ]));
  head.appendChild(el('span',{class:'chip', style: registered?'background:var(--green-soft);color:var(--green);':''},[registered?'Aktif':'Belum']));
  box.appendChild(head);

  if(state.pinSetupOpen){
    const p1 = el('input',{type:'password',inputmode:'numeric',placeholder:'PIN baru (min. 4 digit)',style:'padding:8px 10px;border:1px solid var(--line);border-radius:7px;width:100%;margin-top:8px;'});
    const p2 = el('input',{type:'password',inputmode:'numeric',placeholder:'Ulangi PIN',style:'padding:8px 10px;border:1px solid var(--line);border-radius:7px;width:100%;margin-top:8px;'});
    box.appendChild(p1); box.appendChild(p2);
    const btnRow = el('div',{style:'display:flex;gap:8px;margin-top:8px;'});
    btnRow.appendChild(el('button',{class:'btn btn-primary btn-sm', onclick:()=>{
      if(p1.value.length<4){ alert('PIN minimal 4 digit.'); return; }
      if(p1.value!==p2.value){ alert('Konfirmasi PIN tidak cocok.'); return; }
      setAbsenPin(me.id, p1.value);
      state.pinSetupOpen = false;
      state.absensiMsg = {ok:true, text:'✓ PIN Absen berhasil diatur.'};
      rerender();
    }},['Simpan PIN']));
    btnRow.appendChild(el('button',{class:'btn btn-outline btn-sm', onclick:()=>{ state.pinSetupOpen=false; rerender(); }},['Batal']));
    box.appendChild(btnRow);
  } else {
    const btnRow = el('div',{style:'display:flex;gap:8px;margin-top:10px;'});
    btnRow.appendChild(el('button',{class:'btn btn-outline btn-sm',style:'flex:1;', onclick:()=>{ state.pinSetupOpen=true; rerender(); }},[registered?'Ubah PIN':'Atur PIN']));
    if(registered){
      btnRow.appendChild(el('button',{class:'btn btn-outline btn-sm', onclick:()=>{
        if(confirm('Hapus PIN Absen dari perangkat ini?')){ removeAbsenPin(me.id); rerender(); }
      }},['Hapus']));
    }
    box.appendChild(btnRow);
  }
  return box;
}

function renderAbsenMandiri(body){
  if(!webauthnSupported()){
    body.appendChild(el('div',{class:'warn-note'},['⚠️ Perangkat/browser ini belum mendukung verifikasi sidik jari (WebAuthn), atau halaman tidak dibuka lewat alamat https:// yang aman. Fitur Absen Mandiri memerlukan aplikasi ini dihosting di alamat web (https), bukan dibuka langsung dari file yang diunduh. Fitur lain di aplikasi tetap bisa dipakai seperti biasa.']));
  }

  if(!state.myPegawaiId){
    const panel = el('div',{class:'panel',style:'max-width:420px;margin:20px auto;'});
    panel.appendChild(el('h3',{style:'margin-bottom:6px;'},['👤 Pilih Identitas Anda']));
    panel.appendChild(el('div',{class:'small-note',style:'margin-bottom:12px;'},['Perangkat ini akan diingat sebagai milik Anda untuk absen selanjutnya. Cari nama Anda di bawah ini.']));
    const searchInp = el('input',{placeholder:'Ketik nama Anda…',style:'width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;'});
    panel.appendChild(searchInp);
    const results = el('div',{style:'margin-top:10px;'});
    panel.appendChild(results);
    const renderResults = (q)=>{
      results.innerHTML='';
      if(!q || q.trim().length<2) return;
      const matches = state.pegawai.filter(p=>p.nama.toLowerCase().includes(q.toLowerCase())).slice(0,8);
      if(matches.length===0){ results.appendChild(el('div',{class:'small-note'},['Nama tidak ditemukan. Pastikan sudah terdaftar oleh Admin.'])); return; }
      matches.forEach(p=>{
        const row = el('div',{style:'padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;', onclick:()=>{
          state.myPegawaiId = p.id;
          try{ window.localStorage.setItem('simkin_my_pegawai_id', p.id); }catch(e){}
          rerender();
        }},[
          el('div',null,[el('div',{style:'font-weight:700;'},[p.nama]), el('div',{style:'font-size:11px;color:var(--ink-soft);'},[unitName(p.unitId)+' · '+p.jabatan])]),
          el('span',{style:'color:var(--teal);font-weight:700;'},['Pilih →'])
        ]);
        results.appendChild(row);
      });
    };
    searchInp.addEventListener('input', e=>renderResults(e.target.value));
    body.appendChild(panel);
    return;
  }

  const me = state.pegawai.find(p=>p.id===state.myPegawaiId);
  if(!me){
    body.appendChild(el('div',{class:'panel'},[el('div',{class:'warn-note'},['Data pegawai untuk perangkat ini tidak ditemukan (mungkin dihapus Admin).']),
      el('button',{class:'btn btn-outline',style:'margin-top:10px;', onclick:()=>{ state.myPegawaiId=null; try{window.localStorage.removeItem('simkin_my_pegawai_id');}catch(e){} rerender(); }},['Pilih Ulang Identitas'])]));
    return;
  }

  const panel = el('div',{class:'panel',style:'max-width:460px;margin:10px auto;'});
  const head = el('div',{style:'display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;'});
  head.appendChild(el('div',null,[el('h3',{style:'margin-bottom:2px;'},[me.nama]), el('div',{style:'font-size:11.5px;color:var(--ink-soft);'},[unitName(me.unitId)+' · '+me.jabatan])]));
  head.appendChild(el('button',{class:'btn btn-outline btn-sm', onclick:()=>{ state.myPegawaiId=null; try{window.localStorage.removeItem('simkin_my_pegawai_id');}catch(e){} rerender(); }},['Ganti']));
  panel.appendChild(head);

  if(state.absensiMsg){
    panel.appendChild(el('div',{style:'padding:9px 12px;border-radius:8px;font-size:12.5px;font-weight:600;margin-bottom:12px;'+(state.absensiMsg.ok?'background:var(--green-soft);color:var(--green);':'background:var(--red-soft);color:var(--red);')},[state.absensiMsg.text]));
  }

  if(!fingerprintRegistered(me.id) && !pinRegistered(me.id)){
    panel.appendChild(el('div',{class:'warn-note',style:'margin-bottom:12px;'},['Belum ada metode verifikasi di perangkat ini. Pilih salah satu (atau keduanya) — sidik jari sebagai utama, PIN sebagai cadangan kalau sidik jarinya sewaktu-waktu tidak terdeteksi.']));
    panel.appendChild(buildFingerprintCard(me));
    panel.appendChild(buildPinCard(me));
    body.appendChild(panel);
    return;
  }

  // sudah punya minimal 1 metode — tampilkan panel kelola (bisa dibuka/tutup) + tombol absen
  const manageToggle = el('div',{style:'display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:11.5px;'},[
    el('span',{style:'color:var(--ink-soft);'},['Metode aktif: '+[fingerprintRegistered(me.id)?'Sidik Jari':null, pinRegistered(me.id)?'PIN':null].filter(Boolean).join(' + ')]),
    el('button',{class:'btn btn-outline btn-sm', onclick:()=>{ state.absenManageOpen = !state.absenManageOpen; rerender(); }},[state.absenManageOpen?'Tutup':'⚙️ Kelola'])
  ]);
  panel.appendChild(manageToggle);
  if(state.absenManageOpen){
    panel.appendChild(buildFingerprintCard(me));
    panel.appendChild(buildPinCard(me));
  }

  // sudah terdaftar — tampilkan status hari ini & tombol absen
  const todayBox = el('div',{style:'text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;margin-bottom:14px;'});
  todayBox.appendChild(el('div',{style:'font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.4px;'},['Hari ini, '+new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long'})]));
  const statusRow = el('div',{style:'display:flex;justify-content:center;gap:24px;margin-top:8px;'});
  const masukEl = el('div',null,[el('div',{style:'font-size:10.5px;color:var(--ink-soft);'},['Masuk']), el('div',{id:'st-masuk',style:'font-family:Lexend;font-weight:800;font-size:18px;color:var(--teal);'},['—'])]);
  const pulangEl = el('div',null,[el('div',{style:'font-size:10.5px;color:var(--ink-soft);'},['Pulang']), el('div',{id:'st-pulang',style:'font-family:Lexend;font-weight:800;font-size:18px;color:var(--teal);'},['—'])]);
  statusRow.appendChild(masukEl); statusRow.appendChild(pulangEl);
  todayBox.appendChild(statusRow);
  panel.appendChild(todayBox);

  const btnRow = el('div',{style:'display:flex;gap:10px;'});
  const doPunch = async (jenis)=>{
    state.absensiBusy = true; state.absensiMsg=null; rerender();
    try{
      await doAbsen(me.id, jenis);
      state.absensiMsg = {ok:true, text:'✓ Absen '+(jenis==='masuk'?'Masuk':'Pulang')+' berhasil dicatat pukul '+new Date().toTimeString().slice(0,5)+'.'};
    }catch(e){
      state.absensiMsg = {ok:false, text: e.message||'Absen gagal.'};
    }
    state.absensiBusy = false; rerender();
  };
  btnRow.appendChild(el('button',{class:'btn btn-primary',style:'flex:1;padding:14px;font-size:14px;', disabled: state.absensiBusy, onclick:()=>doPunch('masuk')},[state.absensiBusy?'Memproses…':'📍 Absen Masuk']));
  btnRow.appendChild(el('button',{class:'btn btn-gold',style:'flex:1;padding:14px;font-size:14px;', disabled: state.absensiBusy, onclick:()=>doPunch('pulang')},[state.absensiBusy?'Memproses…':'📍 Absen Pulang']));
  panel.appendChild(btnRow);
  panel.appendChild(el('div',{class:'small-note',style:'margin-top:10px;'},['Menekan tombol akan meminta izin lokasi & verifikasi sidik jari perangkat. Absen ditolak otomatis kalau berada di luar radius lokasi RS yang ditetapkan Admin.']));

  body.appendChild(panel);

  // muat status hari ini secara async setelah elemen ter-render
  (async ()=>{
    const log = await getAbsensiLog(me.id, todayISO());
    const mEl = document.getElementById('st-masuk'); const pEl = document.getElementById('st-pulang');
    if(mEl) mEl.textContent = log.masuk ? log.masuk.jam : '—';
    if(pEl) pEl.textContent = log.pulang ? log.pulang.jam : '—';
  })();
}

/* ============ DASHBOARD ============ */
function renderDashboard(body){
  const list = state.role==='unit' ? state.pegawai.filter(p=>p.unitId===state.currentUnitId) : state.pegawai;
  if(state.role==='unit' && state.units.length===0){
    body.appendChild(el('div',{class:'panel'},[el('div',{class:'empty'},['Belum ada unit terdaftar. Minta Admin menambahkan unit terlebih dahulu di menu "Data Unit".'])]));
    return;
  }
  let cDraft=0,cDiajukan=0,cHrd=0,cFinal=0,cRevisi=0;
  list.forEach(p=>{
    const pn = getPenilaian(state.periode,p.id);
    if(pn.status==='DRAFT') cDraft++;
    else if(pn.status==='DIAJUKAN') cDiajukan++;
    else if(pn.status==='VALIDASI_HRD') cHrd++;
    else if(pn.status==='FINAL') cFinal++;
    else if(pn.status==='REVISI_HRD'||pn.status==='REVISI_DIKLAT') cRevisi++;
  });
  const cards = el('div',{class:'cards-row'},[
    el('div',{class:'stat-card'},[el('div',{class:'num'},[String(list.length)]), el('div',{class:'lbl'},['Total Pegawai'])]),
    el('div',{class:'stat-card'},[el('div',{class:'num'},[String(cDiajukan+cHrd)]), el('div',{class:'lbl'},['Menunggu Validasi'])]),
    el('div',{class:'stat-card red'},[el('div',{class:'num'},[String(cRevisi)]), el('div',{class:'lbl'},['Perlu Revisi'])]),
    el('div',{class:'stat-card green'},[el('div',{class:'num'},[String(cFinal)]), el('div',{class:'lbl'},['Final (Tukin Terbit)'])]),
  ]);
  body.appendChild(cards);

  const panel = el('div',{class:'panel'});
  panel.appendChild(el('h3',null,['Status Penilaian per Pegawai — Periode '+state.periode]));
  if(list.length===0){
    panel.appendChild(el('div',{class:'empty'},[el('div',{class:'big'},['—']),'Belum ada data pegawai. Tambahkan di menu "Data Pegawai".']));
  } else {
    const table = el('table');
    table.appendChild(el('tr',null,[
      el('th',null,['Nama']), el('th',null,['Unit']), el('th',null,['Status']), el('th',null,['Skor Akhir']), el('th',null,['Grade / Tukin'])
    ]));
    list.forEach(p=>{
      const pn = getPenilaian(state.periode,p.id);
      const f = computeFinal(pn, p.unitId);
      const tr = el('tr',null,[
        el('td',null,[p.nama]),
        el('td',null,[unitName(p.unitId)]),
        el('td',null,[statusBadge(pn.status)]),
        el('td',null,[pn.status==='FINAL'? f.percent.toFixed(1)+'%' : '—']),
        el('td',null,[pn.status==='FINAL'? el('span',null,[gradeBadge(f.tier.grade),' · '+f.tier.persen+'%']) : '—']),
      ]);
      table.appendChild(tr);
    });
    panel.appendChild(table);
  }
  body.appendChild(panel);

  const alurPanel = el('div',{class:'panel'});
  alurPanel.appendChild(el('h3',null,['Alur Validasi']));
  const steps = el('div',{class:'progress-steps'});
  const flowLabels = ['Kepala Unit Input','Validasi HRD (Sikap Kerja)','Validasi Diklat (Kinerja & Mutu)','Final — Tukin Terbit'];
  flowLabels.forEach((s,i)=>{
    steps.appendChild(el('div',{class:'pstep done'},[s]));

async function runAIPenilaianBatch(staffList, narrative, pdfAttachment){
  const chunks = [];
  for(let i=0;i<staffList.length;i+=6) chunks.push(staffList.slice(i,i+6));
  let allResults = [];
  const kinerjaKeys = state.aspekConfig.kinerja.map(a=>a.key).join(', ');
  const mutuKeys = state.aspekConfig.mutu.map(a=>a.key).join(', ');
  for(const chunk of chunks){
    const staffLine = chunk.map(p=>p.id+' = '+p.nama).join(' | ');
    const sys = "Anda adalah asisten Manajer Unit RS yang membaca catatan kinerja bulanan (dan/atau dokumen PDF laporan absensi terlampir) untuk menyusun skor penilaian awal (skala 1-4: 1=Kurang,2=Cukup,3=Baik,4=Sangat Baik). Daftar pegawai unit ini (id = nama): "+staffLine+". Cocokkan ke pegawai berdasarkan nama yang disebut di teks maupun di dokumen PDF. Jika ada dokumen PDF berisi rekap absensi (SIMPEG), prioritaskan angka hadir/terlambat/alpha dari dokumen tersebut dibanding perkiraan dari teks. HANYA sertakan pegawai yang benar-benar disebutkan/tercantum. Kembalikan HANYA array JSON valid, tanpa penjelasan lain, format: [{\"id\":\"<id pegawai persis dari daftar>\",\"absensi\":{\"hadir_persen\":number,\"terlambat\":number,\"alpha\":number},\"kinerja\":{"+kinerjaKeys.split(', ').map(k=>'\"'+k+'\":number').join(',')+"},\"mutu\":{"+mutuKeys.split(', ').map(k=>'\"'+k+'\":number').join(',')+"},\"catatan\":\"ringkasan 1 kalimat alasan skor\"}]. Jika data absensi tidak disebutkan sama sekali, boleh diperkirakan wajar (hadir_persen 95-100, terlambat 0-1, alpha 0) dari nada catatan. Semua nilai skor wajib bilangan bulat 1-4.";
    const content = buildAIContent(narrative, pdfAttachment);
    const out = await callClaudeAI(sys, content);
    try{
      const parsed = parseAIJson(out);
      if(Array.isArray(parsed)) allResults = allResults.concat(parsed);
    }catch(e){ /* skip chunk on parse failure */ }
  }
  return allResults;
}

    {key:'kehadiran', label:'Kehadiran', field:'% Kehadiran', higherBetter:true},

      const wrap = el('div',{class:'field'},[el('label',null,[label])]);
      const inp = el('input',{type:'number',value:t[tk],class:'weight-input'});

    row.appendChild(mkTh(def.higherBetter?'Skor 3 jika ≥':'Skor 3 jika ≤', 't3'));

  panel.appendChild(el('h3',null,['Bobot Komponen Penilaian']));
  panel.appendChild(el('div',{class:'warn-note'},['Total bobot harus = 100%. Perubahan berlaku untuk kalkulasi skor akhir semua pegawai pada periode ini dan berikutnya.']));

  const row = el('div',{style:'display:flex;gap:24px;align-items:center;flex-wrap:wrap;'});
  const mk = (label,key)=>{
    const wrap = el('div',{class:'field'},[el('label',null,[label])]);
    const inp = el('input',{type:'number',min:'0',max:'100',value:state.weight[key]});
    inp.className='weight-input';
    inp.addEventListener('change',(e)=>{ state.weight[key]=Number(e.target.value); rerender(); bgSave(saveWeightConfig()); });
    wrap.appendChild(inp);
    return wrap;
  };
  row.appendChild(mk('Sikap Kerja (%)','sikap'));
  row.appendChild(mk('Kinerja Pelayanan (%)','kinerja'));
  row.appendChild(mk('Mutu Pelayanan (%)','mutu'));
  const total = state.weight.sikap+state.weight.kinerja+state.weight.mutu;
  row.appendChild(el('div',{style:'font-family:Lexend;font-weight:800;color:'+(total===100?'var(--green)':'var(--red)')+';font-size:16px;'},['Total: '+total+'%']));
  panel.appendChild(row);
  panel.appendChild(el('div',{class:'small-note'},['Ini adalah bobot default yang berlaku untuk semua unit, kecuali unit tersebut diberi bobot khusus pada bagian "Bobot Khusus per Unit" di bawah.']));
  body.appendChild(panel);

  /* Sub-aspek weights */
  const panelSub = el('div',{class:'panel'});
  panelSub.appendChild(el('h3',null,['Bobot Sub-Aspek per Komponen']));
  panelSub.appendChild(el('div',{class:'warn-note'},['Bobot dalam tiap komponen dapat diubah bebas sesuai prioritas rumah sakit — total tiap komponen idealnya = 100%.']));
  [['Sikap Kerja', 'sikap', state.aspekConfig.sikap],['Kinerja Pelayanan','kinerja',state.aspekConfig.kinerja],['Mutu Pelayanan','mutu',state.aspekConfig.mutu]].forEach(([label,compKey,aspekList])=>{
    panelSub.appendChild(el('h4',{style:'font-size:12.5px;margin:14px 0 6px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.3px;'},[label]));
    const subRow = el('div',{style:'display:flex;gap:16px;flex-wrap:wrap;align-items:center;'});
    aspekList.forEach(a=>{
      const wrap = el('div',{class:'field'},[el('label',null,[a.nama])]);
      const inp = el('input',{type:'number',min:'0',max:'100',value:state.subWeight[compKey][a.key],class:'weight-input'});
      inp.addEventListener('change',(e)=>{ state.subWeight[compKey][a.key]=Number(e.target.value); rerender(); bgSave(saveWeightConfig()); });
      wrap.appendChild(inp);
      subRow.appendChild(wrap);
    });
    const subTotal = aspekList.reduce((s,a)=>s+(state.subWeight[compKey][a.key]||0),0);
    subRow.appendChild(el('div',{style:'font-family:Lexend;font-weight:800;font-size:13px;color:'+(subTotal===100?'var(--green)':'var(--red)')+';'},['= '+subTotal+'%']));
    panelSub.appendChild(subRow);
  });
  body.appendChild(panelSub);

  /* Per-unit weight override */
  const panelUnit = el('div',{class:'panel'});
  panelUnit.appendChild(el('h3',null,['Bobot Khusus per Unit']));
  panelUnit.appendChild(el('div',{class:'small-note'},['Contoh: unit pelayanan langsung (IGD, ICU, Rawat Inap) dapat diberi bobot Mutu Pelayanan lebih besar, sedangkan unit administrasi/penunjang dapat diberi bobot Kinerja Pelayanan lebih besar.']));
  if(state.units.length===0){
    panelUnit.appendChild(el('div',{class:'empty'},['Belum ada unit. Tambahkan di menu "Data Unit".']));
  } else {
    state.units.forEach(u=>{
      const ov = state.perUnitWeight[u.id] || {enabled:false, sikap:state.weight.sikap, kinerja:state.weight.kinerja, mutu:state.weight.mutu};
      const box = el('div',{style:'border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px;'});
      const head = el('div',{style:'display:flex;justify-content:space-between;align-items:center;'});
      head.appendChild(el('div',{style:'font-weight:700;font-family:Lexend;font-size:13px;'},[u.nama]));
      const toggle = el('label',{style:'display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-soft);'});
      const chk = el('input',{type:'checkbox'});
      chk.checked = !!ov.enabled;
      toggle.appendChild(chk); toggle.appendChild(document.createTextNode('Gunakan bobot khusus untuk unit ini'));
      head.appendChild(toggle);
      box.appendChild(head);

      const inputsRow = el('div',{style:'display:flex;gap:16px;margin-top:10px;'+(ov.enabled?'':'opacity:0.4;')});
      const mkU = (label,key)=>{

        const inp = el('input',{type:'number',min:'0',max:'100',value:ov[key],class:'weight-input',disabled:!ov.enabled});
        inp.addEventListener('change',(e)=>{
          if(!state.perUnitWeight[u.id]) state.perUnitWeight[u.id]={enabled:ov.enabled,sikap:ov.sikap,kinerja:ov.kinerja,mutu:ov.mutu};

          rerender();

        });
        wrap.appendChild(inp);
        return wrap;
      };
      inputsRow.appendChild(mkU('Sikap Kerja (%)','sikap'));
      inputsRow.appendChild(mkU('Kinerja Pelayanan (%)','kinerja'));
      inputsRow.appendChild(mkU('Mutu Pelayanan (%)','mutu'));
      const uTotal = (ov.sikap||0)+(ov.kinerja||0)+(ov.mutu||0);
      inputsRow.appendChild(el('div',{style:'font-family:Lexend;font-weight:800;font-size:13px;color:'+(uTotal===100?'var(--green)':'var(--red)')+';align-self:center;'},['= '+uTotal+'%']));
      box.appendChild(inputsRow);

      chk.addEventListener('change', (e)=>{
        if(!state.perUnitWeight[u.id]) state.perUnitWeight[u.id]={enabled:false,sikap:state.weight.sikap,kinerja:state.weight.kinerja,mutu:state.weight.mutu};

  body.appendChild(panelUnit);

  state.tiers.forEach((tier,i)=>{
    const minInp = el('input',{type:'number',value:tier.min,class:'weight-input'});
    minInp.addEventListener('change',(e)=>{ state.tiers[i].min=Number(e.target.value); rerender(); bgSave(saveWeightConfig()); });
    const pctInp = el('input',{type:'number',value:tier.persen,class:'weight-input'});
    pctInp.addEventListener('change',(e)=>{ state.tiers[i].persen=Number(e.target.value); rerender(); bgSave(saveWeightConfig()); });
    table.appendChild(el('tr',null,[el('td',null,[gradeBadge(tier.grade)]), el('td',null,[minInp]), el('td',null,[pctInp])]));
  });
  panel2.appendChild(table);
  body.appendChild(panel2);
}

/* ============ MODALS ============ */
function renderModal(){
  const bg = el('div',{class:'modal-bg', onclick:(e)=>{ if(e.target===bg){ state.modal=null; rerender(); } }});
  const modal = el('div',{class:'modal'});
  bg.appendChild(modal);

  if(state.modal.type==='add_pegawai') buildAddPegawaiModal(modal);
  if(state.modal.type==='input_penilaian') buildInputPenilaianModal(modal);
  if(state.modal.type==='validasi_hrd') buildValidasiHRDModal(modal);
  if(state.modal.type==='validasi_diklat') buildValidasiDiklatModal(modal);

  document.getElementById('root').appendChild(bg);
}

function buildAddPegawaiModal(modal){
  modal.appendChild(el('div',{class:'modal-head'},[el('h3',null,['Tambah Pegawai']), el('button',{class:'x-btn', onclick:()=>{state.modal=null; rerender();}},['✕'])]));
  if(state.units.length===0){
    modal.appendChild(el('div',{class:'warn-note'},['Belum ada unit terdaftar. Tambahkan unit terlebih dahulu di menu "Data Unit" sebelum menambahkan pegawai.']));
    modal.appendChild(el('div',{style:'margin-top:14px;display:flex;justify-content:flex-end;'},[el('button',{class:'btn btn-outline', onclick:()=>{state.modal=null; rerender();}},['Tutup'])]));
    return;
  }
  const grid = el('div',{class:'form-grid'});
  const nama = el('input',{placeholder:'Nama lengkap'});
  const unitSel = el('select');
  state.units.forEach(u=>unitSel.appendChild(el('option',{value:u.id},[u.nama])));
  const jabatan = el('input',{placeholder:'Jabatan'});
  const tukin = el('input',{type:'number',placeholder:'Nominal tukin maksimal (Rp)'});
  grid.appendChild(el('div',{class:'field'},[el('label',null,['Nama']),nama]));
  grid.appendChild(el('div',{class:'field'},[el('label',null,['Unit']),unitSel]));
  grid.appendChild(el('div',{class:'field'},[el('label',null,['Jabatan']),jabatan]));
  grid.appendChild(el('div',{class:'field'},[el('label',null,['Tukin Maksimal (Rp)']),tukin]));
  modal.appendChild(grid);
  modal.appendChild(el('div',{style:'margin-top:18px;display:flex;justify-content:flex-end;gap:8px;'},[
    el('button',{class:'btn btn-outline', onclick:()=>{state.modal=null; rerender();}},['Batal']),
    el('button',{class:'btn btn-primary', onclick:()=>{
      if(!nama.value.trim()){ alert('Nama wajib diisi'); return; }
      const id = 'peg_'+Date.now();
      state.pegawai.push({id, nama:nama.value.trim(), unitId:unitSel.value, jabatan:jabatan.value.trim()||'-', tukin_maks:tukin.value||0});
      state.modal=null;
      rerender();
      bgSave(savePegawaiList());
    }},['Simpan'])
  ]));
}

function buildInputPenilaianModal(modal){
  const p = state.pegawai.find(x=>x.id===state.modal.pegawaiId);
  const pn = getPenilaian(state.periode, p.id);
  const editable = ['DRAFT','REVISI_HRD','REVISI_DIKLAT'].includes(pn.status);

  modal.appendChild(el('div',{class:'modal-head'},[
    el('div',null,[el('h3',null,[p.nama]), el('div',{class:'sub',style:'color:var(--ink-soft);font-size:11.5px;margin-top:3px;'},[unitName(p.unitId)+' · '+p.jabatan])]),
    el('button',{class:'x-btn', onclick:()=>{state.modal=null; rerender();}},['✕'])
  ]));

  if(pn.status==='REVISI_HRD') modal.appendChild(el('div',{class:'warn-note'},['Dikembalikan oleh HRD: '+(pn.catatan_hrd||'-')]));
  if(pn.status==='REVISI_DIKLAT') modal.appendChild(el('div',{class:'warn-note'},['Dikembalikan oleh Diklat: '+(pn.catatan_diklat||'-')]));

  // Sikap Kerja - absensi
  modal.appendChild(el('h4',{style:'margin:14px 0 8px;font-size:13px;'},['1. Sikap Kerja — Data Absensi (Fakta)']));

  if(editable){
    const pullRow = el('div',{style:'display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;'});
    const now = new Date();
    const firstDay = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-01';
    const todayStr = todayISO();
    const dStart = el('input',{type:'date', value:firstDay, style:'padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:12px;'});
    const dEnd = el('input',{type:'date', value:todayStr, style:'padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:12px;'});
    const pullBtn = el('button',{class:'btn btn-outline btn-sm', onclick: async ()=>{
      pullBtn.disabled = true; pullBtn.textContent = 'Menghitung…';
      try{
        const sum = await computeAttendanceSummary(p.id, dStart.value, dEnd.value);
        fHadir.value = sum.hadir_persen; fTerlambat.value = sum.terlambat; fAlpha.value = sum.alpha;
        updateSikapPreview();
        alert('Terisi dari '+sum.hadirHari+'/'+sum.totalHari+' hari data Absen Mandiri ('+dStart.value+' s/d '+dEnd.value+'). Silakan cek lalu simpan.');
      }catch(e){ alert('Gagal mengambil data absensi: '+(e.message||e)); }
      pullBtn.disabled = false; pullBtn.textContent = '⬇️ Isi dari Data Absensi Otomatis';
    }},['⬇️ Isi dari Data Absensi Otomatis']);
    pullRow.appendChild(el('span',{style:'font-size:11px;color:var(--ink-soft);'},['Rentang:']));
    pullRow.appendChild(dStart); pullRow.appendChild(el('span',{style:'font-size:11px;color:var(--ink-soft);'},['s/d'])); pullRow.appendChild(dEnd);
    pullRow.appendChild(pullBtn);
    modal.appendChild(pullRow);
    modal.appendChild(el('div',{class:'small-note',style:'margin-bottom:10px;'},['Menarik rekapan dari log Absen Mandiri (GPS + sidik jari) pegawai ini bila tersedia. Hasilnya mengisi kolom di bawah — tetap bisa disunting manual sebelum disimpan.']));
  }

  const abGrid = el('div',{class:'form-grid'});
  const fHadir = el('input',{type:'number',min:'0',max:'100',value:pn.absensi.hadir_persen, disabled: !editable});
  const fTerlambat = el('input',{type:'number',min:'0',value:pn.absensi.terlambat, disabled: !editable});
  const fAlpha = el('input',{type:'number',min:'0',value:pn.absensi.alpha, disabled: !editable});
  const fSp = el('input',{type:'number',min:'0',value:pn.absensi.sp_aktif, disabled: !editable});
  abGrid.appendChild(el('div',{class:'field'},[el('label',null,['% Kehadiran']),fHadir]));
  abGrid.appendChild(el('div',{class:'field'},[el('label',null,['Jumlah Terlambat (kali)']),fTerlambat]));
  abGrid.appendChild(el('div',{class:'field'},[el('label',null,['Alpha / Tanpa Keterangan (hari)']),fAlpha]));
  abGrid.appendChild(el('div',{class:'field'},[el('label',null,['Surat Peringatan Aktif']),fSp]));
  modal.appendChild(abGrid);
  const sikapPreview = el('div',{class:'small-note'});
  modal.appendChild(sikapPreview);

  function updateSikapPreview(){
    const ab = {hadir_persen:Number(fHadir.value)||0, terlambat:Number(fTerlambat.value)||0, alpha:Number(fAlpha.value)||0, sp_aktif:Number(fSp.value)||0};
    const auto = computeSikapFromAbsensi(ab);
    const avg = avgScore(auto, state.aspekConfig.sikap);
    sikapPreview.textContent = 'Skor Sikap Kerja otomatis (rata-rata): '+avg.toFixed(2)+' / 4 — '+SCORE_LABEL[Math.round(avg)];
  }
  [fHadir,fTerlambat,fAlpha,fSp].forEach(inp=>inp.addEventListener('input',updateSikapPreview));
  updateSikapPreview();

  const sikapManualAspek = state.aspekConfig.sikap.filter(a=>a.type==='manual');
  const sikapScores = {...pn.sikap_score};
  if(sikapManualAspek.length>0){
    modal.appendChild(el('div',{style:'margin-top:8px;'},[el('div',{style:'font-size:11px;color:var(--ink-soft);margin-bottom:4px;'},['Aspek tambahan Sikap Kerja (dinilai manual):'])]));
    sikapManualAspek.forEach(a=>{
      modal.appendChild(buildScoreRow(a, sikapScores[a.key], editable, (v)=>{sikapScores[a.key]=v;}));
    });
  }

  // Kinerja Pelayanan
  modal.appendChild(el('h4',{style:'margin:18px 0 4px;font-size:13px;'},['2. Kinerja Pelayanan']));
  const kinScores = {...pn.kinerja_score};
  state.aspekConfig.kinerja.forEach(a=>{
    modal.appendChild(buildScoreRow(a, kinScores[a.key], editable, (v)=>{kinScores[a.key]=v;}));
  });

  // Mutu Pelayanan
  modal.appendChild(el('h4',{style:'margin:18px 0 4px;font-size:13px;'},['3. Mutu Pelayanan']));
  const mutuScores = {...pn.mutu_score};
  state.aspekConfig.mutu.forEach(a=>{
    modal.appendChild(buildScoreRow(a, mutuScores[a.key], editable, (v)=>{mutuScores[a.key]=v;}));
  });

  const actions = el('div',{style:'margin-top:20px;display:flex;justify-content:flex-end;gap:8px;'});
  actions.appendChild(el('button',{class:'btn btn-outline', onclick:()=>{state.modal=null; rerender();}},['Tutup']));
  if(editable){
    actions.appendChild(el('button',{class:'btn btn-outline', onclick:()=>{
      pn.absensi = {hadir_persen:Number(fHadir.value)||0, terlambat:Number(fTerlambat.value)||0, alpha:Number(fAlpha.value)||0, sp_aktif:Number(fSp.value)||0};
      pn.sikap_score = sikapScores; pn.kinerja_score = kinScores; pn.mutu_score = mutuScores;
      bgSave(savePenilaian(state.periode, p.id));
      alert('Draft tersimpan.'); rerender();
    }},['Simpan Draft']));
    actions.appendChild(el('button',{class:'btn btn-gold', onclick:()=>{
      const sOk = sikapManualAspek.every(a=>typeof sikapScores[a.key]==='number');
      const kOk = state.aspekConfig.kinerja.every(a=>typeof kinScores[a.key]==='number');
      const mOk = state.aspekConfig.mutu.every(a=>typeof mutuScores[a.key]==='number');
      if(!sOk || !kOk || !mOk){ alert('Lengkapi semua aspek penilaian terlebih dahulu.'); return; }
      pn.absensi = {hadir_persen:Number(fHadir.value)||0, terlambat:Number(fTerlambat.value)||0, alpha:Number(fAlpha.value)||0, sp_aktif:Number(fSp.value)||0};
      pn.sikap_score = sikapScores; pn.kinerja_score = kinScores; pn.mutu_score = mutuScores;
      pn.status = 'DIAJUKAN'; pn.submitted_by_unit = true;
      bgSave(savePenilaian(state.periode, p.id));
      state.modal=null; rerender();
    }},['Ajukan untuk Validasi →']));
  }
  modal.appendChild(actions);
}

function buildScoreRow(aspek, currentVal, editable, onChange){
  const row = el('div',{class:'score-row'});
  row.appendChild(el('div',null,[el('div',{class:'aspek-name'},[aspek.nama]), el('div',{class:'aspek-desc'},[aspek.desc])]));
  const pick = el('div',{class:'score-pick'});
  [1,2,3,4].forEach(v=>{
    const btn = el('button',{disabled: !editable},[String(v)]);
    if(currentVal===v) btn.className='sel';
    btn.addEventListener('click',()=>{
      if(!editable) return;
      onChange(v);
      Array.from(pick.children).forEach(c=>c.className='');
      btn.className='sel';
    });
    pick.appendChild(btn);
  });
  row.appendChild(pick);
  return row;
}

function buildValidasiHRDModal(modal){
  const p = state.pegawai.find(x=>x.id===state.modal.pegawaiId);

  abTable.appendChild(el('tr',null,[el('td',null,[String(pn.absensi.hadir_persen)+'%']),el('td',null,[String(pn.absensi.terlambat)]),el('td',null,[String(pn.absensi.alpha)]),el('td',null,[String(pn.absensi.sp_aktif)])]));
  modal.appendChild(abTable);

  modal.appendChild(el('h4',{style:'font-size:13px;margin:14px 0 8px;'},['Skor Sikap Kerja']));
  state.aspekConfig.sikap.forEach(a=>{
    const val = f.sikapCombined[a.key];
    const row = el('div',{class:'score-row'});
    row.appendChild(el('div',null,[el('div',{class:'aspek-name'},[a.nama+(a.type==='manual'?' (input unit)':' (otomatis)')]), el('div',{class:'aspek-desc'},[a.desc])]));

    modal.appendChild(row);
  });
  modal.appendChild(el('div',{class:'small-note'},['Rata-rata Sikap Kerja: '+f.sikapAvg.toFixed(2)+' / 4 ('+SCORE_LABEL[Math.round(f.sikapAvg)]+'). Aspek bertanda "otomatis" bersumber langsung dari data absensi dan tidak dapat diubah manual; aspek bertanda "input unit" dinilai oleh Kepala Unit. HRD memastikan kesesuaian keduanya dengan catatan kepegawaian.']));

  const catatan = el('textarea',{rows:'2',placeholder:'Catatan validasi (wajib diisi jika mengembalikan untuk revisi)'});
  modal.appendChild(el('div',{class:'field',style:'margin-top:12px;'},[el('label',null,['Catatan HRD']), catatan]));

  const actions = el('div',{style:'margin-top:16px;display:flex;justify-content:flex-end;gap:8px;'});
  actions.appendChild(el('button',{class:'btn btn-outline', onclick:()=>{state.modal=null; rerender();}},['Tutup']));
  actions.appendChild(el('button',{class:'btn btn-red', onclick:()=>{
    if(!catatan.value.trim()){ alert('Isi catatan sebagai alasan pengembalian.'); return; }
    pn.status='REVISI_HRD'; pn.catatan_hrd=catatan.value.trim();
    state.modal=null; rerender(); bgSave(savePenilaian(state.periode,p.id));
  }},['Kembalikan untuk Revisi']));
  actions.appendChild(el('button',{class:'btn btn-primary', onclick:()=>{
    pn.status='VALIDASI_HRD'; pn.hrd_ok=true; pn.catatan_hrd=catatan.value.trim();
    state.modal=null; rerender(); bgSave(savePenilaian(state.periode,p.id));
  }},['Validasi & Teruskan ke Diklat →']));
  modal.appendChild(actions);
}

function buildValidasiDiklatModal(modal){
  const p = state.pegawai.find(x=>x.id===state.modal.pegawaiId);
  const pn = getPenilaian(state.periode, p.id);
  const f = computeFinal(pn, p.unitId);

  modal.appendChild(el('div',{class:'modal-head'},[
    el('div',null,[el('h3',null,[p.nama]), el('div',{class:'sub',style:'color:var(--ink-soft);font-size:11.5px;margin-top:3px;'},[unitName(p.unitId)+' · Validasi Diklat'])]),
    el('button',{class:'x-btn', onclick:()=>{state.modal=null; rerender();}},['✕'])
  ]));

  modal.appendChild(el('h4',{style:'font-size:13px;margin-bottom:6px;'},['Kinerja Pelayanan']));
  state.aspekConfig.kinerja.forEach(a=>{
    const row = el('div',{class:'score-row'});
    row.appendChild(el('div',null,[el('div',{class:'aspek-name'},[a.nama]), el('div',{class:'aspek-desc'},[a.desc])]));
    row.appendChild(el('div',{style:'font-family:Lexend;font-weight:800;font-size:15px;color:var(--teal);'},[String(pn.kinerja_score[a.key])+' / 4']));
    modal.appendChild(row);
  });
  modal.appendChild(el('h4',{style:'font-size:13px;margin:14px 0 6px;'},['Mutu Pelayanan']));
  state.aspekConfig.mutu.forEach(a=>{
    const row = el('div',{class:'score-row'});
    row.appendChild(el('div',null,[el('div',{class:'aspek-name'},[a.nama]), el('div',{class:'aspek-desc'},[a.desc])]));
    row.appendChild(el('div',{style:'font-family:Lexend;font-weight:800;font-size:15px;color:var(--teal);'},[String(pn.mutu_score[a.key])+' / 4']));
    modal.appendChild(row);
  });

  modal.appendChild(el('div',{class:'small-note'},[
    'Rata-rata Kinerja: '+f.kinerjaAvg.toFixed(2)+' / 4 · Rata-rata Mutu: '+f.mutuAvg.toFixed(2)+' / 4. '+
    'Estimasi Skor Akhir jika disetujui: '+f.percent.toFixed(1)+'% → Grade '+f.tier.grade+' ('+f.tier.persen+'% tukin).'
  ]));

  const catatan = el('textarea',{rows:'2',placeholder:'Catatan validasi (wajib diisi jika mengembalikan untuk revisi)'});
  modal.appendChild(el('div',{class:'field',style:'margin-top:12px;'},[el('label',null,['Catatan Diklat']), catatan]));

  const actions = el('div',{style:'margin-top:16px;display:flex;justify-content:flex-end;gap:8px;'});
  actions.appendChild(el('button',{class:'btn btn-outline', onclick:()=>{state.modal=null; rerender();}},['Tutup']));
  actions.appendChild(el('button',{class:'btn btn-red', onclick:()=>{
    if(!catatan.value.trim()){ alert('Isi catatan sebagai alasan pengembalian.'); return; }
    pn.status='REVISI_DIKLAT'; pn.catatan_diklat=catatan.value.trim();
    state.modal=null; rerender(); bgSave(savePenilaian(state.periode,p.id));
  }},['Kembalikan untuk Revisi']));
  actions.appendChild(el('button',{class:'btn btn-gold', onclick:()=>{
    pn.status='FINAL'; pn.diklat_ok=true; pn.catatan_diklat=catatan.value.trim();
    state.modal=null; rerender(); bgSave(savePenilaian(state.periode,p.id));
  }},['Validasi & Tetapkan FINAL ✓']));
  modal.appendChild(actions);
}

/* ============ INIT ============ */
(async function init(){
  await loadAll();
  await render();
})();
</script>
